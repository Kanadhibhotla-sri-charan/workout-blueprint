- id: nordic-hamstring-curl
  name: Nordic Hamstring Curl
  summary: >-
    Produces high hamstring tension during the lowering phase with no
    machine, commonly cited for growth and injury-resilience benefits.
  why_this_exists: >-
    Produces high hamstring tension during the lowering phase with no
    machine, and scales through partner support, bands, or range.
  body_regions: [hamstrings]
  primary_targets: [hamstrings]
  secondary_targets: []
  movement_patterns: [knee flexion, eccentric emphasis]
  equipment: [bodyweight, partner or anchor]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [low-setup, skill-coordination]
  resistance_profile: >-
    Bodyweight, eccentric-emphasis; scales through partner support, bands,
    or range.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - One of the most demanding eccentric-tension stimuli available for
      the hamstrings is wanted, commonly cited for both growth and
      injury-resilience benefits.
  less_suitable_when:
    - The descent can't yet be controlled at all, or a user is very sore
      from prior hamstring work — start with a short range and build up
      rather than loading the full eccentric immediately.
