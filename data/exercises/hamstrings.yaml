  video_creator: Renaissance Periodization
  video_title: Lying Leg Curl Technique Guide
  video_status: verified
- id: nordic-hamstring-curl
  name: Nordic Hamstring Curl
  summary: Produces high hamstring tension during the lowering phase with no machine, commonly cited for growth and injury-resilience benefits.
  why_this_exists: Produces high hamstring tension during the lowering phase with no machine, and scales through partner support, bands, or range.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets: []
  physique_targets:
    - hamstrings
  movement_patterns:
    - knee flexion
    - eccentric emphasis
  equipment:
    - bodyweight
    - partner or anchor
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - low-setup
    - skill-coordination
  resistance_profile: Bodyweight, eccentric-emphasis; scales through partner support, bands, or range.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - One of the most demanding eccentric-tension stimuli available for the hamstrings is wanted, commonly cited for both growth and injury-resilience benefits.
  less_suitable_when:
    - The descent can't yet be controlled at all, or a user is very sore from prior hamstring work — start with a short range and build up rather than loading the full eccentric immediately.
  mirror_effect: Consistent training here contributes to overall hamstring density and fullness rather than a specific, localized shape change — its better- documented value is functional (eccentric strength, injury resilience), so don't expect a visibly distinct effect beyond what general hamstring size training already gives.
  advantages: []
  limitations:
    - The technical and strength floor is high — many lifters cannot control any meaningful range at all without a partner or anchor, making it a poor first hamstring exercise.
    - Soreness after a hard set is often severe and can linger for days, which makes the movement difficult to program frequently or stack with other hamstring-heavy work.
    - There's no simple way to add external load once bodyweight control is mastered — progression relies on range, tempo, or band assistance/resistance rather than a barbell-style load increase.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A hinge pattern.
  overlaps_with:
    - seated-leg-curl
    - lying-leg-curl
  evidence_notes:
    - "Worth a correction to the popular framing, not just a citation: the same 2024 trial cited on seated-leg-curl (PMC11419281) directly compared the Nordic curl against lengthened-state training in a hip-flexed position (essentially a loaded seated leg curl) and found the hip-flexed version produced substantially more hamstrings growth (+18% vs. +11% total, +19% vs. +5% biceps femoris long head). The Nordic curl was still an effective hypertrophy stimulus in absolute terms — this isn't a claim that it doesn't work — but \"commonly cited for growth\" undersells that a simpler, less technically demanding machine exercise outperformed it in this trial. The Nordic curl's real, distinct value shown by this and other research is training the eccentric strength and fascicle adaptations tied to injury resilience, which a leg curl doesn't replicate — not necessarily the largest hypertrophy stimulus available."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=4Ym3z8K1L_x
  video_creator: Eugene Teo
  video_title: How to Nordic Hamstring Curl
  video_status: verified
- id: back-extension-45-hip-dominant
  name: 45° Back Extension (Hip-Hinge-Dominant Execution)
  summary: A loaded hip-extension pattern executed with bent knees and a neutral lower back, biasing the hamstrings and glutes specifically.
  why_this_exists: Trains hip extension with far less setup and systemic cost than a heavy hinge. Bending the knees slightly and driving the movement from the hips — keeping the lower back neutral rather than actively extending it — is what shifts this movement's emphasis onto the hamstrings and glutes specifically. This is the execution this record describes; the back module has the same equipment used with a different execution for a different emphasis.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
    - glutes
  secondary_targets:
    - spinal erectors (less than the spinal-extension-dominant execution)
  physique_targets:
    - hamstrings
  movement_patterns:
    - hip extension
    - hip-hinge-dominant execution
  equipment:
    - 45-degree hyperextension bench
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - stable-compound
    - low-fatigue
  resistance_profile: Bodyweight or lightly loaded.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate mechanical-tension hip-extension stimulus specifically for the hamstrings and glutes is wanted, easier to recover from than a heavy hinge, or Romanian deadlifts are grip-limited before the hamstrings are.
  less_suitable_when:
    - The spinal erectors need to be biased instead — keeping the legs straighter and allowing controlled lumbar extension, described in the back module's copy of this exercise, does that instead. Back symptoms are a stop-and-assess signal either way, not something to train through.
  mirror_effect: Similar visible direction to a Romanian deadlift — hamstring and glute fullness together, viewed from behind — but at a lighter load ceiling, so the effect tends to be more modest unless this is adding volume on top of heavier hinge work rather than replacing it.
  advantages: []
  limitations:
    - The bent-knee, hip-driven technique this record describes is easy to blur into the straighter-leg, spinal-extension-dominant version without deliberate cueing, muddying which muscles actually get trained.
    - Loading options are limited on most equipment — a plate held to the chest or a light barbell across the back is usually the ceiling before stability becomes the limiting factor rather than the target muscles.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A leg-curl pattern.
  overlaps_with:
    - romanian-deadlift
    - back-extension-45-spinal-dominant (back module) — same equipment, spinal-extension-dominant execution, erector bias instead.
  evidence_notes: []
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=qZW_9pG7_A0
  video_creator: Eugene Teo
  video_title: 45 Degree Back Extension for Glutes & Hamstrings
  video_status: verified
