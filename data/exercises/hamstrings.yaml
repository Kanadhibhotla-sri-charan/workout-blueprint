- id: seated-leg-curl
  name: Seated Leg Curl
  summary: Trains knee flexion with the hip bent, a stretch-biased mechanical- tension stimulus a hinge alone doesn't provide.
  why_this_exists: Trains knee flexion with the hip bent, so the hamstrings are longer during the curl than in a lying version.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets: []
  physique_targets:
    - hamstrings
  movement_patterns:
    - knee flexion
    - hip flexed
  equipment:
    - machine
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - lengthened-position-emphasis
  resistance_profile: Fixed-path machine.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stretch-biased, mechanical-tension knee-flexion stimulus is wanted that a hinge alone doesn't provide, pushed safely close to failure on a fixed path.
  less_suitable_when:
    - The hips lift off the pad during the set, which shortens the hamstrings and trades away the stretch position that gives this movement its distinct value.
  mirror_effect: Tends to show up as fullness through the upper-to-mid hamstring, the part of the back of the thigh that's stretched hardest in this hip-flexed position — a rounder look through that region rather than added mass at the knee end of the muscle.
  advantages: []
  limitations:
    - Machine availability and design vary a lot — a poorly fitted thigh pad or pivot point lets the hips creep up during the set, quietly trading away the stretch position that makes this exercise distinct.
    - The fixed pad position doesn't accommodate every body size well, which can create uncomfortable pressure points before the hamstrings are meaningfully fatigued.
  technique_cues:
    - Set the back pad so your knees line up with the pivot and lock the thigh pad down firmly just above the knees.
    - Sit tall or lean slightly forward to increase the hamstring stretch.
    - Curl the heels down and back as far as possible, then return slowly to nearly straight legs.
  common_mistakes:
    - "Thigh pad left loose: the hips rise and the stretched, hip-bent position that makes this exercise distinct is lost."
    - "Letting the stack slam between reps: tension drops at the stretched end."
    - "Short reps that never return to the stretched position: drops the lengthened range this machine is chosen for."
  programming_notes:
    - This hip-flexed knee-flexion position is close to what a 2024 direct trial (see evidence_notes) found to be a particularly effective lengthened-position stimulus for the hamstrings — more effective, by that trial's numbers, than the Nordic hamstring curl. See nordic-hamstring-curl below for the comparison.
  alternatives: []
  complements:
    - A hinge pattern.
  overlaps_with:
    - lying-leg-curl
  evidence_notes:
    - Direct hypertrophy trial evidence, not just the general ROM literature. A 2024 study (PMC11419281, Medicine & Science in Sports & Exercise) compared the Nordic hamstring curl against "lengthened state eccentric training" (LSET) — isoinertial weight-stack resistance trained in an accentuated hip-flexed position, essentially this record's hip-flexed knee-flexion setup. LSET produced substantially greater total hamstrings growth (+18% vs. +11%) and biceps femoris long-head growth (+19% vs. +5%) than the Nordic curl over the training period. This directly supports the seated leg curl's hip-flexed, lengthened-position value — see nordic-hamstring-curl's evidence_notes for the fuller comparison and what it means for that more popular exercise.
    - "This finding sits within the broader stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023, International Journal of Strength and Conditioning) both found training at longer muscle length tends to match or beat training that avoids the stretch, though a later trial (Wolf et al., 2025, PubMed 39959841) found the advantage over full ROM is smaller than earlier work suggested."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=Orxowest56U
  video_creator: Renaissance Periodization
  video_title: Seated Leg Curl
  video_status: verified
  video_verified_on: "2026-08-28"
  video_verification_method: metadata
