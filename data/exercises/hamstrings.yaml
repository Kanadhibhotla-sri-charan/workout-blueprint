- id: nordic-hamstring-curl
  name: Nordic Hamstring Curl
  summary: Produces high hamstring tension during the lowering phase with no machine, commonly cited for growth and injury-resilience benefits.
  why_this_exists: Produces high hamstring tension during the lowering phase with no machine, and scales through partner support, bands, or range.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets: []
  physique_targets:
    - hamstrings
  movement_patterns:
    - knee flexion
    - eccentric emphasis
  equipment:
    - bodyweight
    - partner or anchor
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - low-setup
    - skill-coordination
  resistance_profile: Bodyweight, eccentric-emphasis; scales through partner support, bands, or range.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - One of the most demanding eccentric-tension stimuli available for the hamstrings is wanted, commonly cited for both growth and injury-resilience benefits.
  less_suitable_when:
    - The descent can't yet be controlled at all, or a user is very sore from prior hamstring work — start with a short range and build up rather than loading the full eccentric immediately.
  mirror_effect: Consistent training here contributes to overall hamstring density and fullness rather than a specific, localized shape change — its better- documented value is functional (eccentric strength, injury resilience), so don't expect a visibly distinct effect beyond what general hamstring size training already gives.
  advantages: []
  limitations:
    - The technical and strength floor is high — many lifters cannot control any meaningful range at all without a partner or anchor, making it a poor first hamstring exercise.
    - Soreness after a hard set is often severe and can linger for days, which makes the movement difficult to program frequently or stack with other hamstring-heavy work.
    - There's no simple way to add external load once bodyweight control is mastered — progression relies on range, tempo, or band assistance/resistance rather than a barbell-style load increase.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A hinge pattern.
  overlaps_with:
    - seated-leg-curl
    - lying-leg-curl
  evidence_notes:
    - "Worth a correction to the popular framing, not just a citation: the same 2024 trial cited on seated-leg-curl (PMC11419281) directly compared the Nordic curl against lengthened-state training in a hip-flexed position (essentially a loaded seated leg curl) and found the hip-flexed version produced substantially more hamstrings growth (+18% vs. +11% total, +19% vs. +5% biceps femoris long head). The Nordic curl was still an effective hypertrophy stimulus in absolute terms — this isn't a claim that it doesn't work — but \"commonly cited for growth\" undersells that a simpler, less technically demanding machine exercise outperformed it in this trial. The Nordic curl's real, distinct value shown by this and other research is training the eccentric strength and fascicle adaptations tied to injury resilience, which a leg curl doesn't replicate — not necessarily the largest hypertrophy stimulus available."
