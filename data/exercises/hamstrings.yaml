  video_title: How to Do a Nordic Hamstring Curl
  video_status: verified
  video_verified_on: "2026-08-28"
  video_verification_method: metadata
- id: back-extension-45-hip-dominant
  name: 45° Back Extension (Hip-Hinge-Dominant Execution)
  summary: A loaded hip-extension pattern executed with bent knees and a neutral lower back, biasing the hamstrings and glutes specifically.
  why_this_exists: Trains hip extension with far less setup and systemic cost than a heavy hinge. Bending the knees slightly and driving the movement from the hips — keeping the lower back neutral rather than actively extending it — is what shifts this movement's emphasis onto the hamstrings and glutes specifically. This is the execution this record describes; the back module has the same equipment used with a different execution for a different emphasis.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
    - glutes
  secondary_targets:
    - spinal erectors (less than the spinal-extension-dominant execution)
  physique_targets:
    - hamstrings
  movement_patterns:
    - hip extension
    - hip-hinge-dominant execution
  equipment:
    - 45-degree hyperextension bench
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - stable-compound
    - low-fatigue
  resistance_profile: Bodyweight or lightly loaded.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate mechanical-tension hip-extension stimulus specifically for the hamstrings and glutes is wanted, easier to recover from than a heavy hinge, or Romanian deadlifts are grip-limited before the hamstrings are.
  less_suitable_when:
    - The spinal erectors need to be biased instead — keeping the legs straighter and allowing controlled lumbar extension, described in the back module's copy of this exercise, does that instead. Back symptoms are a stop-and-assess signal either way, not something to train through.
  mirror_effect: Similar visible direction to a Romanian deadlift — hamstring and glute fullness together, viewed from behind — but at a lighter load ceiling, so the effect tends to be more modest unless this is adding volume on top of heavier hinge work rather than replacing it.
  advantages: []
  limitations:
    - The bent-knee, hip-driven technique this record describes is easy to blur into the straighter-leg, spinal-extension-dominant version without deliberate cueing, muddying which muscles actually get trained.
    - Loading options are limited on most equipment — a plate held to the chest or a light barbell across the back is usually the ceiling before stability becomes the limiting factor rather than the target muscles.
  technique_cues:
    - 'Set the pad so its top edge sits just below the hip crease, letting the hips bend freely, and hook the heels under the rollers with a slight bend in the knees.'
    - 'Cross the arms over the chest, or hold a plate there, and set the lower back in a neutral position.'
    - 'Hinge down from the hips until the hamstrings are stretched, keeping the back neutral rather than rounding it.'
    - 'Drive the hips into the pad to raise the torso until it''s in line with the legs, stopping without arching the lower back past neutral.'
  common_mistakes:
    - 'Pad set too high, at the stomach: the hips can''t bend, so the lower back does the moving instead of the hips.'
    - 'Arching the lower back at the top: turns it into the lower-back version and moves work off the hamstrings and glutes.'
    - 'Rounding the back to get lower: the range comes from the spine rather than the hips.'
  programming_notes: []
  alternatives: []
  complements:
    - A leg-curl pattern.
  overlaps_with:
    - romanian-deadlift
    - back-extension-45-spinal-dominant (back module) — same equipment, spinal-extension-dominant execution, erector bias instead.
  evidence_notes: []
  review_status: reviewed
