- id: romanian-deadlift
  name: Romanian Deadlift
  summary: The main loadable hinge, and the most direct way to train the hamstrings and glutes together in a lengthened position under heavy load.
  why_this_exists: The main loadable hinge, and the most direct way to train the hamstrings in a lengthened position under heavy load.
  body_regions:
    - hips
    - hamstrings
  primary_targets:
    - hamstrings
    - glutes
  secondary_targets:
    - spinal erectors
  physique_targets:
    - hamstrings
    - gluteus-maximus
  movement_patterns:
    - hip hinge
    - moderate knee bend
  equipment:
    - barbell
    - dumbbell
    - smith machine
  equipment_setups:
    - [barbell]
    - [dumbbell]
    - [smith machine]
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - heavy-compound
    - lengthened-position-emphasis
  resistance_profile: A barbell allows the heaviest fixed-path load; dumbbells allow independent arms and are often the easier entry point for learning the hinge; a Smith machine variant exists (see hips module) for beginners still learning to control the bar path.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - Heavy hinge work is wanted that trains the hamstrings and glutes together at a long muscle length.
  less_suitable_when:
    - Lower-back fatigue is already high, capping how much of the lengthened-position load can safely be used.
  mirror_effect: Tends to show up as overall thickness through the back of the thigh and glutes together, viewed from behind — this builds hamstring and glute mass as one connected unit rather than shaping either specifically, since the movement trains them together by design.
  advantages: []
  limitations:
    - Technical demand is real — hips-back, spine-neutral, bar-close-to-the- legs all have to happen together, and it takes real practice to load heavily without the lower back rounding.
    - Grip often fails before the hamstrings do at heavier loads, capping the set short of the target muscles' true limit unless straps or a mixed/hook grip are used.
    - Hamstring flexibility limits how deep the hinge can go while keeping the back neutral, so a stiff lifter may not reach a meaningful stretch even with good technique.
  technique_cues:
    - Start standing with the bar at your hips, feet hip width, knees softly bent.
    - Push the hips straight back, keeping the bar against or close to your thighs as it travels down.
    - Keep the back flat and the knee bend roughly the same all the way down. This is a hip hinge, not a squat.
    - Lower until you feel a strong hamstring stretch or your back starts to round, often around mid-shin, then drive the hips forward to stand.
  common_mistakes:
    - "Rounding the lower back to reach lower: depth should stop where a flat back stops."
    - "Letting the bar drift away from the legs: increases the load on the lower back."
    - "Bending the knees more as you descend: it turns into a deadlift and the hamstring stretch shrinks."
    - "Letting grip end the set before the hamstrings: use straps at heavier loads."
  programming_notes:
    - Unlike the 45-degree back extension or Bulgarian split squat, an RDL doesn't have a clean discrete technique switch that biases glutes vs. hamstrings — the moderate knee bend trains both together by design throughout the whole movement. For a more hamstring-isolated stimulus, see stiff-leg-deadlift below. For a more glute-isolated, shortened-position stimulus, see hip-thrust in the hips module.
    - "Good morning variation: the same hip hinge with the bar on the upper back instead of in the hands, so grip never limits the set. The load sits further from the hips, so far less weight is used, and the lower back has to hold position under a longer lever."
  alternatives: []
  complements:
    - A leg-curl pattern, since a hinge alone leaves knee flexion untrained.
  overlaps_with:
    - stiff-leg-deadlift
    - back-extension-45-hip-dominant
    - back-extension-45-spinal-dominant (back module)
    - conventional-deadlift (back module) — related but distinct hinge that starts from the floor.
    - smith-machine-romanian-deadlift (hips module)
  evidence_notes:
    - "Draws on the general stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023, International Journal of Strength and Conditioning) both found training at longer muscle length tends to match or beat training that avoids the stretch; a later trial (Wolf et al., 2025, PubMed 39959841) found the advantage over full ROM is smaller than earlier work suggested. No study specific to the RDL was located — see seated-leg-curl's evidence_notes below for the closest direct hamstring-length hypertrophy trial found, which used a hip-flexed knee-flexion position rather than a hinge."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=lKLYvNGz6mk
  video_creator: Steev
  video_title: "Barbell Romanian Deadlift - Proper Form & Technique [4K]"
  video_status: verified
  video_verified_on: "2026-08-28"
  video_verification_method: metadata
- id: stiff-leg-deadlift
  name: Stiff-Leg Deadlift
  summary: Keeping the knees much straighter than an RDL pushes nearly all the stretch and tension onto the hamstrings specifically.
  why_this_exists: Keeping the knees much straighter than an RDL removes most of the knee's contribution to the hinge, which pushes nearly all of the stretch and tension onto the hamstrings specifically, at the cost of the load capacity and lower-back sparing the RDL's knee bend provides.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets:
    - glutes (less than an RDL)
  physique_targets:
    - hamstrings
  movement_patterns:
    - hip hinge
    - straight-leg execution
  equipment:
    - barbell
    - dumbbell
  equipment_setups:
    - [barbell]
    - [dumbbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - heavy-compound
    - lengthened-position-emphasis
  resistance_profile: Free-weight profile, minimal knee bend.
  stability_demand: medium
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The most hamstring-isolated stretch-mediated stimulus this movement family offers is specifically wanted, and the added lower-back demand the straighter legs bring can be tolerated.
  less_suitable_when:
    - Lower-back fatigue or hamstring flexibility limits how straight the legs can safely stay, or the RDL's higher load capacity and more balanced glute-hamstring stimulus is wanted instead.
  mirror_effect: Where an RDL adds hamstring and glute mass together, this tends to show up as hamstring fullness specifically — the back of the thigh filling out on its own, with less glute involvement than an RDL gives, since the straighter knee shifts more of the work there.
  advantages: []
  limitations:
    - The near-straight knee removes most of the lower back's usual mechanical advantage in a hinge, so lower-back load per pound lifted is higher than an RDL's.
    - Load capacity is meaningfully lower than an RDL's, since hamstring and lower-back tolerance for the straighter-leg stretch position becomes the limiting factor before the hamstrings' full strength does.
    - Poor hamstring flexibility can force the back to round to reach depth, which defeats the point of the exercise and adds spinal risk instead of hamstring stimulus.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A knee-flexion-dominant leg curl or a shortened-position movement such as the hip thrust.
  overlaps_with:
    - romanian-deadlift
  evidence_notes:
    - Same general stretch-mediated hypertrophy grounding as romanian-deadlift above — see that record's evidence_notes. No study specific to the stiff-leg deadlift was located.
  review_status: needs-review
