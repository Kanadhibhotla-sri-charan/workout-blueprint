- id: romanian-deadlift
  name: Romanian Deadlift
  summary: The main loadable hinge, and the most direct way to train the hamstrings and glutes together in a lengthened position under heavy load.
  why_this_exists: The main loadable hinge, and the most direct way to train the hamstrings in a lengthened position under heavy load.
  body_regions:
    - hips
    - hamstrings
  primary_targets:
    - hamstrings
    - glutes
  secondary_targets:
    - spinal erectors
  physique_targets:
    - hamstrings
    - gluteus-maximus
  movement_patterns:
    - hip hinge
    - moderate knee bend
  equipment:
    - barbell
    - dumbbell
    - smith machine
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - heavy-compound
    - lengthened-position-emphasis
  resistance_profile: A barbell allows the heaviest fixed-path load; dumbbells allow independent arms and are often the easier entry point for learning the hinge; a Smith machine variant exists (see hips module) for beginners still learning to control the bar path.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The strongest available stretch-mediated growth stimulus for the hamstrings and glutes together is wanted, in a lengthened position no curl variation reaches.
  less_suitable_when:
    - Lower-back fatigue is already high, capping how much of the lengthened-position load can safely be used.
  mirror_effect: Tends to show up as overall thickness through the back of the thigh and glutes together, viewed from behind — this builds hamstring and glute mass as one connected unit rather than shaping either specifically, since the movement trains them together by design.
  advantages: []
  limitations:
    - Technical demand is real — hips-back, spine-neutral, bar-close-to-the- legs all have to happen together, and it takes real practice to load heavily without the lower back rounding.
    - Grip often fails before the hamstrings do at heavier loads, capping the set short of the target muscles' true limit unless straps or a mixed/hook grip are used.
    - Hamstring flexibility limits how deep the hinge can go while keeping the back neutral, so a stiff lifter may not reach a meaningful stretch even with good technique.
  technique_cues: []
  common_mistakes: []
  programming_notes:
    - Unlike the 45-degree back extension or Bulgarian split squat, an RDL doesn't have a clean discrete technique switch that biases glutes vs. hamstrings — the moderate knee bend trains both together by design throughout the whole movement. For a more hamstring-isolated stimulus, see stiff-leg-deadlift below. For a more glute-isolated, shortened-position stimulus, see hip-thrust in the hips module.
  alternatives: []
  complements:
    - A leg-curl pattern, since a hinge alone leaves knee flexion untrained.
  overlaps_with:
    - stiff-leg-deadlift
    - back-extension-45-hip-dominant
    - back-extension-45-spinal-dominant (back module)
    - conventional-deadlift (back module) — related but distinct hinge that starts from the floor.
    - smith-machine-romanian-deadlift (hips module)
  evidence_notes:
    - "Draws on the general stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023, International Journal of Strength and Conditioning) both found training at longer muscle length tends to match or beat training that avoids the stretch; a later trial (Wolf et al., 2025, PubMed 39959841) found the advantage over full ROM is smaller than earlier work suggested. No study specific to the RDL was located — see seated-leg-curl's evidence_notes below for the closest direct hamstring-length hypertrophy trial found, which used a hip-flexed knee-flexion position rather than a hinge."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=7AacDYGek_w
  video_creator: Renaissance Periodization
  video_title: Barbell Romanian Deadlift Technique Guide
  video_status: verified
- id: stiff-leg-deadlift
  name: Stiff-Leg Deadlift
  summary: Keeping the knees much straighter than an RDL pushes nearly all the stretch and tension onto the hamstrings specifically.
  why_this_exists: Keeping the knees much straighter than an RDL removes most of the knee's contribution to the hinge, which pushes nearly all of the stretch and tension onto the hamstrings specifically, at the cost of the load capacity and lower-back sparing the RDL's knee bend provides.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets:
    - glutes (less than an RDL)
  physique_targets:
    - hamstrings
  movement_patterns:
    - hip hinge
    - straight-leg execution
  equipment:
    - barbell
    - dumbbell
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - heavy-compound
    - lengthened-position-emphasis
  resistance_profile: Free-weight profile, minimal knee bend.
  stability_demand: medium
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The most hamstring-isolated stretch-mediated stimulus this movement family offers is specifically wanted, and the added lower-back demand the straighter legs bring can be tolerated.
  less_suitable_when:
    - Lower-back fatigue or hamstring flexibility limits how straight the legs can safely stay, or the RDL's higher load capacity and more balanced glute-hamstring stimulus is wanted instead.
  mirror_effect: Where an RDL adds hamstring and glute mass together, this tends to show up as hamstring fullness specifically — the back of the thigh filling out on its own, with less glute involvement than an RDL gives, since the straighter knee shifts more of the work there.
  advantages: []
  limitations:
    - The near-straight knee removes most of the lower back's usual mechanical advantage in a hinge, so lower-back load per pound lifted is higher than an RDL's.
    - Load capacity is meaningfully lower than an RDL's, since hamstring and lower-back tolerance for the straighter-leg stretch position becomes the limiting factor before the hamstrings' full strength does.
    - Poor hamstring flexibility can force the back to round to reach depth, which defeats the point of the exercise and adds spinal risk instead of hamstring stimulus.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A knee-flexion-dominant leg curl or a shortened-position movement such as the hip thrust.
  overlaps_with:
    - romanian-deadlift
  evidence_notes:
    - Same general stretch-mediated hypertrophy grounding as romanian-deadlift above — see that record's evidence_notes. No study specific to the stiff-leg deadlift was located.
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=CN_7ZxaEPCo
  video_creator: Renaissance Periodization
  video_title: Stiff-Legged Deadlift Technique Guide
  video_status: verified
- id: seated-leg-curl
  name: Seated Leg Curl
  summary: Trains knee flexion with the hip bent, a stretch-biased mechanical- tension stimulus a hinge alone doesn't provide.
  why_this_exists: Trains knee flexion with the hip bent, so the hamstrings are longer during the curl than in a lying version.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets: []
  physique_targets:
    - hamstrings
  movement_patterns:
    - knee flexion
    - hip flexed
  equipment:
    - machine
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - lengthened-position-emphasis
  resistance_profile: Fixed-path machine.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stretch-biased, mechanical-tension knee-flexion stimulus is wanted that a hinge alone doesn't provide, pushed safely close to failure on a fixed path.
  less_suitable_when:
    - The hips lift off the pad during the set, which shortens the hamstrings and trades away the stretch position that gives this movement its distinct value.
  mirror_effect: Tends to show up as fullness through the upper-to-mid hamstring, the part of the back of the thigh that's stretched hardest in this hip-flexed position — a rounder look through that region rather than added mass at the knee end of the muscle.
  advantages: []
  limitations:
    - Machine availability and design vary a lot — a poorly fitted thigh pad or pivot point lets the hips creep up during the set, quietly trading away the stretch position that makes this exercise distinct.
    - The fixed pad position doesn't accommodate every body size well, which can create uncomfortable pressure points before the hamstrings are meaningfully fatigued.
  technique_cues: []
  common_mistakes: []
  programming_notes:
    - This hip-flexed knee-flexion position is close to what a 2024 direct trial (see evidence_notes) found to be a particularly effective lengthened-position stimulus for the hamstrings — more effective, by that trial's numbers, than the Nordic hamstring curl. See nordic-hamstring-curl below for the comparison.
  alternatives: []
  complements:
    - A hinge pattern.
  overlaps_with:
    - lying-leg-curl
  evidence_notes:
    - Direct hypertrophy trial evidence, not just the general ROM literature. A 2024 study (PMC11419281, Medicine & Science in Sports & Exercise) compared the Nordic hamstring curl against "lengthened state eccentric training" (LSET) — isoinertial weight-stack resistance trained in an accentuated hip-flexed position, essentially this record's hip-flexed knee-flexion setup. LSET produced substantially greater total hamstrings growth (+18% vs. +11%) and biceps femoris long-head growth (+19% vs. +5%) than the Nordic curl over the training period. This directly supports the seated leg curl's hip-flexed, lengthened-position value — see nordic-hamstring-curl's evidence_notes for the fuller comparison and what it means for that more popular exercise.
    - "This finding sits within the broader stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023, International Journal of Strength and Conditioning) both found training at longer muscle length tends to match or beat training that avoids the stretch, though a later trial (Wolf et al., 2025, PubMed 39959841) found the advantage over full ROM is smaller than earlier work suggested."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=Orxowest56U
  video_creator: Renaissance Periodization
  video_title: Seated Leg Curl Technique Guide
  video_status: verified
- id: lying-leg-curl
  name: Lying Leg Curl
  summary: Trains knee flexion with the hip closer to straight, a distinct growth emphasis from the seated version.
  why_this_exists: Trains knee flexion with the hip closer to straight, a different hip position from the seated version.
  body_regions:
    - hamstrings
  primary_targets:
    - hamstrings
  secondary_targets:
    - calves
  physique_targets:
    - hamstrings
  movement_patterns:
    - knee flexion
    - hip extended
  equipment:
    - machine
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-fatigue
  resistance_profile: Fixed-path machine.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A knee-flexion, mechanical-tension stimulus is wanted in a shorter-hamstring position than the seated curl provides, for a genuinely different growth emphasis.
  less_suitable_when:
    - The hips rise during the set, signaling the load has outrun what the hamstrings alone can control.
  mirror_effect: Tends to show up lower and closer to the knee than the seated version's effect, since the hip-extended position shifts where the hamstring is working hardest — the two together tend to fill out the back of the thigh more evenly, top to bottom, than either does alone.
  advantages: []
  limitations:
    - The hips have a strong tendency to rise off the pad as the load gets heavy, which lets other muscles compensate and undercuts the isolation this exercise is meant to provide.
    - A prone position is uncomfortable or inaccessible for some body types and for anyone with hip-flexor or lower-back sensitivity to being face-down under load.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
