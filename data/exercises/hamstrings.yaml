- id: back-extension-45-hip-dominant
  name: 45° Back Extension (Hip-Hinge-Dominant Execution)
  summary: >-
    A loaded hip-extension pattern executed with bent knees and a
    neutral lower back, biasing the hamstrings and glutes specifically.
  why_this_exists: >-
    Trains hip extension with far less setup and systemic cost than a
    heavy hinge. Bending the knees slightly and driving the movement
    from the hips — keeping the lower back neutral rather than actively
    extending it — is what shifts this movement's emphasis onto the
    hamstrings and glutes specifically. This is the execution this
    record describes; the back module has the same equipment used with a
    different execution for a different emphasis.
  body_regions: [hamstrings]
  primary_targets: [hamstrings, glutes]
  secondary_targets: [spinal erectors (less than the spinal-extension-dominant execution)]
  movement_patterns: [hip extension, hip-hinge-dominant execution]
  equipment: [45-degree hyperextension bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound, low-fatigue]
  resistance_profile: >-
    Bodyweight or lightly loaded.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate mechanical-tension hip-extension stimulus specifically
      for the hamstrings and glutes is wanted, easier to recover from than
      a heavy hinge, or Romanian deadlifts are grip-limited before the
      hamstrings are.
  less_suitable_when:
    - The spinal erectors need to be biased instead — keeping the legs
      straighter and allowing controlled lumbar extension, described in
      the back module's copy of this exercise, does that instead. Back
      symptoms are a stop-and-assess signal either way, not something to
      train through.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A leg-curl pattern.
  overlaps_with:
    - romanian-deadlift
    - "back-extension-45-spinal-dominant (back module) — same equipment,
      spinal-extension-dominant execution, erector bias instead."
  evidence_notes: []
  review_status: draft
