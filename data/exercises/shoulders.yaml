- id: dumbbell-lateral-raise
  name: Dumbbell Lateral Raise
  summary: >-
    The most available direct side-delt option, a mechanical-tension and
    pump stimulus that peaks near the top of the range.
  why_this_exists: >-
    The most available direct side-delt option, and the main way to add
    shoulder width when pressing already covers the front delts.
  body_regions: [shoulders]
  primary_targets: [lateral deltoids]
  secondary_targets: []
  physique_targets: [side-delt]
  movement_patterns: [shoulder abduction]
  equipment: [dumbbell]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-setup]
  resistance_profile: >-
    Free-weight profile, hardest near the top of the range (roughly
    shoulder height), easiest at the bottom.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A side-delt-specific mechanical-tension and pump stimulus is wanted
      that peaks near the top of the range, the position most people mean
      when picturing lateral raise work.
  less_suitable_when:
    - Momentum takes over the rep — once the swing is doing the work, the
      growth stimulus on the side delt mostly disappears even though the
      weight is still moving.
  mirror_effect: >-
    This is usually the actual answer when someone wants "wider shoulders" —
    tends to show up as width across the shoulders viewed from the front, since
    the lateral deltoid is what creates that width independent of waist size,
    more directly than front- or rear-delt work does.
  advantages: []
  limitations:
    - The load ceiling is low relative to how heavy it can feel — most lifters
      plateau on usable weight quickly since the leverage at the top of the
      range is poor.
    - Trap and upper-shoulder involvement can creep in and take over the
      movement, especially under fatigue, without an obvious change in how the
      rep looks.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A vertical press and rear-delt work.
  overlaps_with:
    - cable-lateral-raise
    - machine-lateral-raise
  evidence_notes: []
  review_status: reviewed

