- id: rear-delt-fly
  name: Rear-Delt Fly
  summary: >-
    Direct, stretch-mediated rear-delt work that pressing-heavy routines
    commonly leave short.
  why_this_exists: >-
    Direct rear-delt work, which pressing-heavy routines commonly leave
    short.
  body_regions: [shoulders]
  primary_targets: [posterior deltoids]
  secondary_targets: [mid-back]
  movement_patterns: [shoulder horizontal abduction]
  equipment: [dumbbell, machine]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation]
  resistance_profile: >-
    Free-weight or fixed-path machine, depending on equipment.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stretch-mediated, isolated growth stimulus for the rear delts is
      wanted without adding another heavy pull to the session.
  less_suitable_when:
    - The elbows bend enough that the movement turns into a row — the
      stimulus shifts toward a more mechanical-tension, less isolated
      rear-delt effect, which may or may not be what was wanted.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Horizontal pulling and side-delt work.
  overlaps_with:
    - face-pull
    - cable-rear-delt-builder
    - rear-delt-row
    - machine-reverse-fly
  evidence_notes:
    - >-
      No hypertrophy trial specific to the rear-delt fly or posterior
      deltoid muscle length was located — this is a weaker claim than
      several of the other stretch-mediated claims in this dataset. It's
      an inference from the general stretch-mediated hypertrophy
      literature (Schoenfeld & Grgic, 2020, SAGE Open Medicine; Wolf et
      al., 2023, International Journal of Strength and Conditioning) and
      from the mechanical fact that resistance peaks near the horizontally
      abducted, stretched end of this movement's range, not a
      posterior-deltoid-specific finding. A later trial (Wolf et al.,
      2025, PubMed 39959841) found the general stretch advantage over
      full ROM is smaller than earlier work suggested, which further
      tempers how much weight this claim should carry.
  review_status: draft

