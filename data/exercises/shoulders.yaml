  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A side-delt-specific mechanical-tension and pump stimulus is wanted that peaks near the top of the range, the position most people mean when picturing lateral raise work.
  less_suitable_when:
    - Momentum takes over the rep — once the swing is doing the work, the growth stimulus on the side delt mostly disappears even though the weight is still moving.
  mirror_effect: This is usually the actual answer when someone wants "wider shoulders" — tends to show up as width across the shoulders viewed from the front, since the lateral deltoid is what creates that width independent of waist size, more directly than front- or rear-delt work does.
  advantages: []
  limitations:
    - The load ceiling is low relative to how heavy it can feel — most lifters plateau on usable weight quickly since the leverage at the top of the range is poor.
