- id: overhead-press
  name: Overhead Press
  summary: >-
    The main loadable vertical press, the primary mechanical-tension
    stimulus for the front delts and triceps together.
  why_this_exists: >-
    The main loadable vertical press, useful when a user wants overhead
    pressing strength rather than only shoulder size.
  body_regions: [shoulders]
  primary_targets: [anterior deltoids]
  secondary_targets: [triceps, upper chest, trunk musculature]
  physique_targets: [front-delt]
  movement_patterns: [vertical press]
  equipment: [barbell, dumbbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile; barbell allows the heaviest fixed-path load,
    dumbbells allow independent arms.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The primary mechanical-tension and strength-building stimulus for
      the front delts is the goal, with the triceps and upper chest
      sharing a meaningful part of the load.
  less_suitable_when:
    - The routine already has a heavy pressing movement covering
      mechanical tension, and what's missing is a pump-oriented finisher
      or dedicated side- and rear-delt work.
  mirror_effect: >-
    Tends to show up as roundness and mass on the front of the shoulder,
    contributing to overall shoulder size from the front — though front delts
    already get heavy indirect work from chest pressing, so this often isn't
    the missing piece if the front of the shoulder already looks developed.
  advantages: []
  limitations:
    - Shoulder mobility limits are common and can cap how heavy or how deep
      this can safely be loaded, well before the delts and triceps reach their
      true strength ceiling.
    - The trunk-bracing and stability demand is high, so a weak core or poor
      bracing technique can become the limiting factor before the shoulders
      are.
    - Load progression is comparatively slow next to other big lifts, since the
      muscles moving the bar are smaller than a squat or deadlift's.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Side- and rear-delt work, which overhead pressing does not replace.
  overlaps_with:
    - smith-machine-shoulder-press
    - cable-shoulder-press
    - seated-machine-shoulder-press
  evidence_notes: []
  review_status: reviewed

- id: smith-machine-shoulder-press
  name: Smith Machine Shoulder Press
  summary: >-
    A barbell on a fixed vertical rail, removing most of the balance and
    bracing demand of a standing or seated overhead press.
  why_this_exists: >-
    A barbell constrained to a fixed vertical or near-vertical rail, which
    removes most of the balance and bracing demand of a standing or
    seated barbell overhead press while still allowing a fixed-bar
    loading path.
  body_regions: [shoulders]
  primary_targets: [anterior deltoids]
  secondary_targets: [triceps]
  physique_targets: [front-delt]
  movement_patterns: [vertical press]
  equipment: [smith machine]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Fixed vertical/near-vertical rail path; free-weight-like load curve.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - A front-delt set is wanted pushed closer to true failure than could
      safely be handled unspotted with a free barbell.
  less_suitable_when:
    - The fixed rail's path doesn't match a user's natural press arc,
      which can shift stress onto the joint rather than the muscle.
  mirror_effect: >-
    Same visible direction as the free-weight overhead press — front-delt
    roundness and mass — since the fixed rail changes stability demand, not
    which muscle ends up carrying the load.
  advantages: []
  limitations:
    - The fixed rail path doesn't match every lifter's natural press arc, and
      pressing straight up rather than slightly forward can load the shoulder
      joint uncomfortably for some.
    - It removes the stabilizer training that a free-weight press provides, so
      strength built here transfers only partially back to an unassisted press.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Side- and rear-delt work.
  overlaps_with:
    - overhead-press
    - seated-machine-shoulder-press
    - cable-shoulder-press
  evidence_notes: []
  review_status: reviewed

- id: cable-shoulder-press
  name: Cable Shoulder Press
  summary: >-
    A standing cable press with constant tension through the range, for
    a pump-oriented front-delt stimulus.
  why_this_exists: >-
    A standing cable press keeps constant tension through the range,
    unlike a free-weight press where the load is easiest at lockout, and
    lets the path converge in front of the body the way free weights and
    machines don't.
  body_regions: [shoulders]
  primary_targets: [anterior deltoids]
  secondary_targets: [triceps]
  physique_targets: [front-delt]
  movement_patterns: [vertical press]
  equipment: [cable]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [isolation]
  resistance_profile: >-
    Constant tension through the whole range.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - An overhead press that stays hard at the top of the range is wanted,
      or a lower-fatigue finisher after a heavier press.
  less_suitable_when:
    - The priority is the heaviest possible loading for a strength-driven
      stimulus, which free weights deliver more of.
  mirror_effect: >-
    Same front-delt visible direction as a barbell or machine overhead press,
    just at a lighter load ceiling — a supplementary contributor to front-
    shoulder size rather than a primary one.
  advantages: []
  limitations:
    - Absolute load is capped well below what a barbell or heavy dumbbells
      allow, so this isn't a strength-building substitute for a free-weight
      press.
    - Requires dual cable stations or a dedicated cable press setup, which
      isn't available in every gym the way a barbell or dumbbells are.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A heavier barbell or dumbbell press.
  overlaps_with:
    - overhead-press
    - seated-machine-shoulder-press
    - smith-machine-shoulder-press
  evidence_notes: []
  review_status: reviewed

- id: seated-machine-shoulder-press
  name: Seated Machine Shoulder Press
  summary: >-
    A stable vertical press well suited to pushing a front-delt set to
    true failure without managing balance or bar path.
  why_this_exists: >-
    A stable vertical press that lets the user push closer to failure
    without managing balance or bar path.
  body_regions: [shoulders]
  primary_targets: [anterior deltoids]
  secondary_targets: [triceps]
  physique_targets: [front-delt]
  movement_patterns: [vertical press]
  equipment: [machine]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Fixed-path, often cam-adjusted through the range.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: medium
  best_used_when:
    - A front-delt set is wanted pushed to true failure, or into a drop
      set — removing the balance demand means the last hard reps come from
      the delts giving out, not a stabilizer losing control of the bar.
  less_suitable_when:
    - The machine path or handle position doesn't match a user's shoulder
      mechanics, which can blunt the tension the delts actually feel
