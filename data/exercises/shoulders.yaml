  name: Cable Lateral Raise
  summary: >-
    A side-delt option whose resistance stays meaningful in the stretched
    bottom position, unlike a dumbbell raise.
  why_this_exists: >-
    A side-delt option whose resistance stays meaningful lower in the
    range than a dumbbell raise, which changes where the movement feels
    hardest.
