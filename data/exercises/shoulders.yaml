- id: face-pull
  name: Face Pull
  summary: >-
    Combines a moderate rear-delt stimulus with a shoulder-rotation,
    joint-health component in one movement.
  why_this_exists: >-
    Combines rear-delt work with a shoulder-rotation component, so one
    movement covers a growth role and a joint-health role together when
    time is short.
  body_regions: [shoulders]
  primary_targets: [posterior deltoids, mid/lower trapezius]
  secondary_targets: [external rotators]
  physique_targets: [rear-delt]
  movement_patterns: [shoulder horizontal abduction, external rotation]
  equipment: [cable, band]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-fatigue]
  resistance_profile: >-
    Cable or band, constant tension.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate rear-delt stimulus is wanted alongside rotator-cuff and
      shoulder-control work in a single movement, rather than programming
      them separately.
  less_suitable_when:
    - Load is heavy enough that the rotation is lost — at that point it
      functions more like a rear-delt row and loses the control-work half
      of its value.
  mirror_effect: >-
    Contributes some roundness to the back of the shoulder, but as a secondary
    effect — its main role is joint health and rotation control, so it
    shouldn't be relied on as the primary way to build visible rear-delt size.
  advantages: []
  limitations:
    - The rotation component that gives this movement its joint-health value is
