- id: cable-lateral-raise
  name: Cable Lateral Raise
  summary: A side-delt option whose resistance stays meaningful in the stretched bottom position, unlike a dumbbell raise.
  why_this_exists: A side-delt option whose resistance stays meaningful lower in the range than a dumbbell raise, which changes where the movement feels hardest.
  body_regions:
    - shoulders
  primary_targets:
    - lateral deltoids
  secondary_targets: []
  physique_targets:
    - side-delt
  movement_patterns:
    - shoulder abduction
  equipment:
    - cable
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - lengthened-position-emphasis
  resistance_profile: Constant tension through the whole range, meaningful even in the stretched bottom position.
  stability_demand: low
  skill_demand: low
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - A side-delt stimulus is wanted that stays under real tension in the stretched, bottom position — where a dumbbell raise is easiest — for a genuinely different growth emphasis, or to train one side at a time.
  less_suitable_when:
    - The simplest possible setup for side-delt work is preferred, or another movement already provides a stretched-position stimulus and the top-loaded dumbbell profile is wanted instead.
  mirror_effect: Same shoulder-width visible direction as a dumbbell lateral raise, since it's the same lateral deltoid being trained.
  advantages: []
  limitations:
    - Requires a low cable pulley and enough station space to stand at the right distance and angle, which is a real setup constraint most gyms can accommodate but not instantly.
    - The line of pull only stays ideal for part of the range unless the pulley height and standing position are tuned carefully, which takes more setup attention than a dumbbell raise.
  technique_cues:
    - Set the pulley at its lowest point, stand side-on, and hold the handle in the far hand so the cable crosses in front of your body.
    - Lean slightly away from the stack and keep a soft bend in the elbow.
    - Raise the arm out to the side, leading with the elbow, to about shoulder height.
    - Lower slowly until the hand crosses your midline. That stretched bottom position is where a cable beats a dumbbell.
  common_mistakes:
    - "Shrugging the shoulder up as the arm rises: the upper traps take over the lift."
    - "Bending the elbow more as you lift: the raise turns into a row and the side delt does less."
    - "Cutting the bottom short: skips the stretched range that is the reason to use a cable for this."
  programming_notes:
    - "Lean-away variation: hold an upright with the free hand and lean the torso well away from the stack. This starts the raise from a more stretched shoulder position, so the cable loads the bottom of the movement more; keep the lean fixed for the whole set so the angle doesn't drift from rep to rep."
  alternatives: []
  complements:
    - A vertical press; may be run alongside dumbbell raises only if the routine needs both profiles.
