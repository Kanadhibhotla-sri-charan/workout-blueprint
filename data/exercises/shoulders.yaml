  best_used_when:
    - A free-weight, mechanical-tension rear-delt stimulus is wanted and a bent-over seated position under light-to-moderate load can be held.
  less_suitable_when:
    - The lower back rounds to hold the bent-over position, or the elbows flare up and out instead of staying down and back — both signal the stimulus is drifting away from the rear delts.
  mirror_effect: Similar rear-delt visible direction to a fly, plus some contribution to upper-back thickness from the row pattern, so the effect reads as a bit more "connected" to the back than an isolated fly does.
  advantages: []
  limitations:
    - The bent-over seated position places real demand on the lower back to stay braced, which can become the limiting factor before the rear delts are.
    - It's easy to let the elbows flare up and out under fatigue, which shifts the stimulus toward the upper back and traps instead of the rear delts.
  technique_cues:
    - Sit at the end of a bench and hinge forward with a flat back until the torso is close to the thighs, letting the dumbbells hang straight down.
    - Row the dumbbells back toward your hips with the elbows staying down, not flaring out to the sides.
    - As the elbows travel back, rotate the thumbs back and up to finish the movement.
    - Keep the lower back braced and the torso still throughout.
