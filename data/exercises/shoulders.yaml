- id: cable-rear-delt-builder
  name: Cable Rear Delt Builder
  summary: >-
    A cable row keeping the elbows below the wrists throughout the pull,
    holding the resistance angle specifically on the rear delt.
  why_this_exists: >-
    A cable row that keeps the elbows slightly below the wrists all the
    way through the pull, which holds the resistance angle on the rear
    delt's specific action instead of letting the traps or rhomboids take
    over higher in the range.
  body_regions: [shoulders]
  primary_targets: [posterior deltoids]
  secondary_targets: [mid-back]
  physique_targets: [rear-delt]
  movement_patterns: [shoulder horizontal abduction, elbow flexion]
  equipment: [cable]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation]
  resistance_profile: >-
    Cable stack, constant tension.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - A mechanical-tension rear-delt stimulus is wanted with more loadable
      progression than a fly typically allows, while keeping the
      resistance angled specifically at the rear delt rather than the
      traps.
  less_suitable_when:
    - The elbows rise above the wrists at the top, which drifts the
