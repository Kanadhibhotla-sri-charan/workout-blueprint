- id: overhead-press
  name: Overhead Press
  summary: >-
    The main loadable vertical press, the primary mechanical-tension
    stimulus for the front delts and triceps together.
  why_this_exists: >-
    The main loadable vertical press, useful when a user wants overhead
    pressing strength rather than only shoulder size.
  body_regions: [shoulders]
  primary_targets: [anterior deltoids]
  secondary_targets: [triceps, upper chest, trunk musculature]
  movement_patterns: [vertical press]
  equipment: [barbell, dumbbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile; barbell allows the heaviest fixed-path load,
    dumbbells allow independent arms.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The primary mechanical-tension and strength-building stimulus for
      the front delts is the goal, with the triceps and upper chest
      sharing a meaningful part of the load.
  less_suitable_when:
    - The routine already has a heavy pressing movement covering
      mechanical tension, and what's missing is a pump-oriented finisher
      or dedicated side- and rear-delt work.
  mirror_effect: ""
  advantages: []
  limitations: []
