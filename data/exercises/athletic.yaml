- id: box-jump
  name: Box Jump
  summary: A two-foot jump onto a box, landing softly on top, for vertical power with a low landing impact.
  why_this_exists: Jumping onto a box trains explosive vertical leg drive, useful for jump smashes and overhead reaches, while the box shortens the fall and softens the landing.
  body_regions:
    - quads
    - hips
  primary_targets:
    - quads
    - glutes
  secondary_targets:
    - calves
    - hamstrings
  physique_targets: []
  functional_goals:
    - lower-body-power
  movement_patterns:
    - jump and land
    - two-foot jump onto a box
  equipment:
    - plyo box
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - skill-coordination
  training_mode: power
  resistance_profile: Bodyweight; box height sets the challenge, and stepping down keeps landing impact low.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  time:
    setup_minutes: 1
    seconds_per_set: 20
    rest_seconds: [90, 180]
    per_side: false
    superset_friendly: false
  best_used_when:
    - Vertical jumping power is the goal and a stable box is available.
  less_suitable_when:
    - No stable box is available, or the shins and knees need protecting from a missed jump.
  mirror_effect: Not a physique exercise; it builds vertical jumping power.
  advantages: []
  limitations:
    - A missed jump onto a hard box can catch the shins, so box height must stay well within ability.
    - Height is limited by hip mobility on landing as much as by power, so a higher box is not always a better jump.
  technique_cues:
    - Stand about a foot from a stable box with the feet hip width apart.
    - Dip quickly into a quarter squat while swinging the arms back.
    - Swing the arms forward and jump up onto the box, landing softly on the whole foot in the same quarter-squat position.
    - Stand tall on the box, then step down rather than jumping down.
  common_mistakes:
    - 'Choosing a box so high you land in a deep squat: it tests hip mobility, not power, and raises the risk of a missed jump.'
    - 'Jumping down off the box: adds landing impact the drill is meant to avoid.'
    - 'Knees caving inward on landing: the main joint risk in two-foot jumping.'
  programming_notes:
    - Raise the box only when every landing is quiet and in a quarter squat.
  alternatives: []
  complements:
    - A heavy squat pattern for underlying leg strength.
