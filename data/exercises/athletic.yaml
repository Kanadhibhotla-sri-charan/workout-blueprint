  laterality: bilateral
  coverage_categories:
    - low-setup
    - equipment-limited-substitute
  training_mode: power
  resistance_profile: Bodyweight; ground-contact speed, not height, sets the challenge.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 0
    seconds_per_set: 20
    rest_seconds: [90, 180]
    per_side: false
    superset_friendly: false
  best_used_when:
    - Quick, reactive ankles are wanted as part of a warm-up or before court work.
  less_suitable_when:
    - The Achilles or calves are sore; calf raises build tolerance first.
  mirror_effect: Not a physique exercise; it builds reactive ankle and calf stiffness.
  advantages: []
  limitations:
    - The repeated impact builds up quickly in the Achilles and calves, so volume has to increase gradually.
    - It trains small, fast bounces, not maximal jumping height.
  technique_cues:
    - Stand tall with the feet about hip width apart and the knees almost straight.
    - Bounce up and down on the balls of the feet, keeping the heels just off the floor.
    - Keep each ground contact as short and quiet as possible, letting the ankles do the work.
    - Stop the set when the bounces lose their rhythm or get loud.
  common_mistakes:
    - 'Bending the knees a lot on each bounce: the knees and hips take over and the ankle stiffness the drill trains is lost.'
    - 'Letting the heels slam down: removes the springy contact and increases impact on the heel and Achilles.'
    - 'Doing long sets: once contacts slow down it is no longer the reactive quality being trained.'
  programming_notes:
    - Progress from two feet to forward, sideways and then single-leg pogos.
  alternatives: []
  complements:
    - A loaded calf raise for strength.
