# Athletic training (badminton-oriented) exercises — athletic expansion, 2026-10.
# Every record here carries a training_mode, so it is recommended only for the
# functional goals it lists and never appears in physique-target or region answers.

- id: split-squat-jump
  name: Split-Squat Jump
  summary: An explosive jump from a split stance, switching legs in the air and landing softly in the opposite split.
  why_this_exists: Badminton lunges and push-offs happen from a split stance. Jumping from that position trains fast, powerful leg drive and a controlled landing with only bodyweight.
  body_regions:
    - quads
    - hips
  primary_targets:
    - quads
    - glutes
  secondary_targets:
    - calves
    - hamstrings
  physique_targets: []
  functional_goals:
    - lower-body-power
  movement_patterns:
    - jump and land
    - split stance, switching legs in the air
  equipment:
    - bodyweight
  exercise_type: compound
  laterality: alternating
  coverage_categories:
    - low-setup
    - skill-coordination
    - equipment-limited-substitute
  training_mode: power
  resistance_profile: Bodyweight; the landing absorbs more force than the jump produces, so landing control sets the limit.
  stability_demand: high
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  time:
    setup_minutes: 0
    seconds_per_set: 20
    rest_seconds: [90, 180]
    per_side: false
    superset_friendly: false
  best_used_when:
    - Explosive leg drive from a split stance is wanted with no equipment, early in a session while fresh.
  less_suitable_when:
    - Knees or ankles are sore, or a soft, balanced landing is not yet reliable; split squats and lunges build the base first.
  mirror_effect: Not a physique exercise; it builds explosive leg drive and landing control rather than muscle size.
  advantages: []
  limitations:
    - Landing force is high, so knee or ankle discomfort, or a hard floor, limits how many quality reps are possible.
    - Balance on landing usually fails before power does when learning it.
  technique_cues:
    - Start in a split stance with the front knee bent, back knee just off the floor, and torso upright.
    - Drive hard through both feet and swing the arms up to jump straight up.
    - Switch legs in the air so the opposite leg lands in front.
    - Land softly on the balls of the feet into the same split depth, then pause or go straight into the next rep.
  common_mistakes:
    - 'Landing stiff-legged: the knees and ankles take the impact instead of the muscles absorbing it.'
    - 'Front knee collapsing inward on landing: loads the knee awkwardly and is the main injury risk of the drill.'
    - 'Rushing reps once tired: jumps get lower and landings sloppier, which turns power work into conditioning.'
  programming_notes:
    - Learn it with a pause in the split after every landing before moving to continuous reps.
  alternatives: []
  complements:
    - A heavy single-leg strength exercise such as a split squat.
