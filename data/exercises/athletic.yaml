- id: lateral-bound
  name: Lateral Bound (Skater Jump)
  summary: A sideways jump from one leg to the other, sticking each landing, for side-to-side power and control.
  why_this_exists: Badminton movement is heavily sideways. Bounding from one leg to the other trains lateral push-off power and the control to stop on a single leg.
  body_regions:
    - hips
    - quads
  primary_targets:
    - glutes
    - quads
    - hip abductors
  secondary_targets:
    - calves
    - adductors
  physique_targets: []
  functional_goals:
    - lower-body-power
    - agility-change-of-direction
  movement_patterns:
    - lateral locomotion
    - single-leg jump and land
  equipment:
    - bodyweight
  exercise_type: compound
  laterality: alternating
  coverage_categories:
    - low-setup
    - skill-coordination
    - unilateral
    - equipment-limited-substitute
  training_mode: power
  resistance_profile: Bodyweight; distance and speed of each bound set the intensity.
  stability_demand: high
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  time:
    setup_minutes: 0
    seconds_per_set: 20
    rest_seconds: [90, 180]
    per_side: false
    superset_friendly: false
  best_used_when:
    - Side-to-side push-off power and single-leg landing control are the goal.
  less_suitable_when:
    - Single-leg balance is not yet steady; lateral lunges build the position first.
  mirror_effect: Not a physique exercise; it builds lateral power and single-leg landing control.
  advantages: []
  limitations:
    - Each landing loads one knee and ankle sideways, so it needs a non-slip surface and a gradual build-up of distance.
    - It is easy to sacrifice landing control for distance without noticing.
  technique_cues:
    - Stand on one leg with a soft knee and hips back, as if in a shallow single-leg squat.
    - Push off sideways from that leg, swinging the arms across to help.
    - Land on the opposite leg with a soft knee, hips back and the knee tracking over the toes.
    - Hold the landing for a second before bounding back the other way.
  common_mistakes:
    - 'Landing with the knee caving inward: the main injury risk in lateral jumping.'
    - 'Bounding too far to stick the landing: the extra distance comes at the cost of the control the drill trains.'
    - 'Standing tall on landing: the hips and knees stop absorbing force and the joints take it instead.'
  programming_notes:
    - 'Progress distance first, then speed: stick every landing before linking bounds continuously.'
  alternatives: []
  complements:
    - A lateral lunge for strength in the same position.
