  video_title: How to Train Your Neck (Safely)
  video_status: verified
- id: neck-extension
  name: Neck Extension
  summary: Loads the back of the neck, the region most responsible for visible neck thickness.
  why_this_exists: Loads the back of the neck, which is what most neck-size goals are actually about, and which sitting posture rarely trains.
  body_regions:
    - neck
  primary_targets:
    - neck extensors
  secondary_targets:
    - upper trapezius
  physique_targets:
    - neck-thickness
  movement_patterns:
    - neck extension
  equipment:
    - harness
    - plate
    - machine
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-fatigue
  resistance_profile: Harness, plate, or machine.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - A genuine mechanical-tension growth stimulus is wanted for the area most responsible for visible neck thickness, once control has already been built through isometric work.
  less_suitable_when:
    - Load or range can't yet be controlled — a lighter load with a slower tempo is the better next step, not a heavier one.
  mirror_effect: Tends to show up as width and thickness across the back and sides of the neck, viewed from behind or the side — this is the region most responsible for the "thick neck" look people are usually picturing when they say a neck looks bigger.
  advantages: []
  limitations:
    - The neck is a small, structurally sensitive area — load has to increase far more conservatively here than in almost any other muscle group, or symptoms can appear well before a meaningful growth stimulus is reached.
    - Equipment for loading neck extension directly (a harness or dedicated machine) is uncommon in most gyms, which limits how heavily this can realistically be progressed for many people.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Neck flexion work, so the region is not trained in one direction only.
  overlaps_with:
    - neck-flexion
  evidence_notes:
    - This is a lower-stakes claim than the region-bias claims elsewhere in this dataset — it's a claim about visible anatomy, not about differential muscle recruitment or growth. The neck extensors and upper trapezius make up the visible bulk of the back and sides of the neck, which is standard anatomical description rather than a contested hypertrophy finding, so it doesn't carry the same evidence-quality caveats as the muscle-head-bias claims in the arms, chest, and calves modules.
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=8fK1_yL9zW0
  video_creator: Alan Thrall
  video_title: Neck Harness Extension Technique
  video_status: verified
- id: neck-flexion
  name: Neck Flexion
  summary: Loads the front of the neck, which shrugs, rows, and extension work do not cover.
  why_this_exists: Loads the front of the neck, which shrugs, rows, and extension work do not cover.
  body_regions:
    - neck
  primary_targets:
    - neck flexors
  secondary_targets: []
  physique_targets:
    - neck-thickness
  movement_patterns:
    - neck flexion
  equipment:
    - plate
    - band
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-fatigue
    - low-setup
  resistance_profile: Plate or band.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Neck extension is already trained and a balanced growth stimulus on both sides of the neck is wanted rather than one direction only.
  less_suitable_when:
    - Range or load can't be controlled, or symptoms appear at any point in the range — this is a stop signal, not something to push through for more stimulus.
  mirror_effect: Less visually prominent than extension work, since the front-of-neck muscles contribute less to overall neck bulk — the visible effect is more about rounding out the front profile and avoiding a lopsided, extension- only look than adding comparable size.
  advantages: []
  limitations:
    - Usable load is low relative to the effort involved, since the neck flexors are comparatively weak and the safe range of motion is small.
    - Plate or band positioning at the forehead is awkward to set up consistently, which makes clean progressive overload harder to track than with most other exercises.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Neck extension work.
  overlaps_with:
