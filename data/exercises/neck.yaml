  video_verification_method: metadata
- id: neck-flexion
  name: Neck Flexion
  summary: Loads the front of the neck, which shrugs, rows, and extension work do not cover.
  why_this_exists: Loads the front of the neck, which shrugs, rows, and extension work do not cover.
  body_regions:
    - neck
  primary_targets:
    - neck flexors
  secondary_targets: []
  physique_targets:
    - neck-thickness
  movement_patterns:
    - neck flexion
  equipment:
    - plate
    - band
  equipment_setups:
    - [plate]
    - [band]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-fatigue
    - low-setup
  resistance_profile: Plate or band.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Neck extension is already trained and a balanced growth stimulus on both sides of the neck is wanted rather than one direction only.
  less_suitable_when:
    - Range or load can't be controlled, or symptoms appear at any point in the range — this is a stop signal, not something to push through for more stimulus.
  mirror_effect: Less visually prominent than extension work, since the front-of-neck muscles contribute less to overall neck bulk — the visible effect is more about rounding out the front profile and avoiding a lopsided, extension-only look than adding comparable size.
  advantages: []
  limitations:
    - Usable load is low relative to the effort involved, since the neck flexors are comparatively weak and the safe range of motion is small.
    - Plate or band positioning at the forehead is awkward to set up consistently, which makes clean progressive overload harder to track than with most other exercises.
  technique_cues:
    - 'Lie face up on a bench with the head and upper neck off the end, holding a folded towel and a light plate on the forehead with both hands (or a band around the forehead anchored behind you).'
    - 'Let the head lower back slowly to a comfortable, roughly level position, not as far as it will go.'
    - 'Tuck the chin and curl the head up toward the chest, then lower it back under control.'
    - 'Start very light and increase the load in small steps, ending the set if any pain or symptoms appear.'
  common_mistakes:
    - 'Letting the head drop quickly into the bottom: the neck takes the load at the end of its range without control.'
    - 'Lifting the shoulders off the bench to raise the head: the abs and torso do the curling instead of the neck flexors.'
    - 'Jumping up in plate size too quickly: the neck tolerates fast load increases poorly, and symptoms can appear before any real benefit.'
  programming_notes: []
  alternatives: []
  complements:
    - Neck extension work.
