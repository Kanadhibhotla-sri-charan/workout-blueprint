- id: isometric-neck-hold
  name: Isometric Neck Hold
  summary: The lowest-barrier entry point to neck training, building tolerance and control before loaded work.
  why_this_exists: The lowest-barrier entry point to neck training, with no equipment and no head movement under load.
  body_regions:
    - neck
  primary_targets:
    - neck flexors
    - neck extensors
    - neck lateral flexors
  secondary_targets: []
  movement_patterns:
    - neck isometric
  equipment:
    - bodyweight
    - band
    - manual resistance
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - low-setup
    - equipment-limited-substitute
  resistance_profile: Isometric, direction depends on which resistance is applied.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Initial tolerance and control are being built before loaded work — this delivers a modest strength stimulus but is not a primary size driver on its own.
  less_suitable_when:
    - Loaded work is already well tolerated and a clearer path to progressive overload is wanted, which isometric holds are poorly suited to track over time.
  mirror_effect: Minimal visible effect on its own — this is a control-and-tolerance builder, not a sizing tool, so don't expect a noticeably thicker neck from holds alone before moving to loaded work.
  advantages: []
  limitations:
    - Without a load number or clear progression marker, it's genuinely hard to tell whether the hold is actually getting more demanding over time or has plateaued.
    - The stimulus is inherently mild — this is a starting point for building tolerance and control, not something that keeps producing meaningful growth once loaded neck work is well tolerated.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Loaded neck work introduced gradually afterward.
  overlaps_with: []
  evidence_notes: []
