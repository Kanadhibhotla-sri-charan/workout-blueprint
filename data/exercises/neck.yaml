- id: lateral-neck-flexion
  name: Lateral Neck Flexion
  summary: Covers side-to-side neck strength, which straight flexion and extension leave out.
  why_this_exists: Covers side-to-side neck strength, which straight flexion and extension leave out.
  body_regions:
    - neck
  primary_targets:
    - lateral neck flexors
  secondary_targets: []
  movement_patterns:
    - neck lateral flexion
  equipment:
    - bodyweight
    - band
    - manual resistance
  exercise_type: isolation
  laterality: unilateral
  coverage_categories:
    - isolation
    - low-fatigue
    - low-setup
  resistance_profile: Bodyweight, band, or manual resistance.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Complete, symmetric neck development is wanted rather than only the front-to-back directions, often for a sport-specific reason.
  less_suitable_when:
    - The basic front-to-back directions aren't yet trained comfortably, or symptoms are present — those come first.
  mirror_effect: A minor, symmetry-oriented effect — some added width to the sides of the neck, but not a primary driver of overall neck size the way extension work is; most useful for a complete, even-looking neck rather than visible bulk on its own.
  advantages: []
  limitations:
    - This is a niche addition for most lifters — it targets a comparatively minor muscle group and rarely drives visible neck-size goals compared to extension and flexion work.
    - Manual resistance (a training partner's hand) is inconsistent rep to rep, which makes progressive overload harder to track than with a fixed load.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Flexion and extension work.
