- id: neutral-grip-lat-pulldown
  name: Neutral-Grip Lat Pulldown
  summary: >-
    A parallel or angled pulldown grip that avoids the shoulder's
    end-range external rotation, often the kindest grip on the joints.
  why_this_exists: >-
    A parallel or angled grip that avoids the shoulder's end-range
    external rotation a wide pronated grip asks for, which many find is
    the kindest grip on the shoulders and elbows.
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: [mid-back, elbow flexors (between pronated and supinated)]
  physique_targets: [lat-width]
  movement_patterns: [vertical pull, neutral grip]
  equipment: [cable]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Cable stack, small load increments.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  best_used_when:
    - Shoulder or elbow discomfort is what actually ends a set before the
      lats are meaningfully fatigued — the neutral grip removes that
      limiter and lets more effort go toward a lat-width stimulus.
  less_suitable_when:
    - Shoulder and elbow comfort aren't limiting factors, in which case a
      pronated or supinated grip may deliver a more specific bias without
      a meaningful downside.
  mirror_effect: >-
    Same width-building visible direction as any lat pulldown — the grip is a
    joint-comfort choice, not a change in which muscle or visible outcome is
    being trained.
  advantages: []
  limitations:
    - Not every cable station has a neutral-grip attachment available, which
      limits how consistently this specific grip can be programmed.
    - The joint-friendlier angle comes at some cost to range of motion on
      certain machines, depending on where the handle attachment sits relative
      to the body.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A rowing pattern.
  overlaps_with:
    - lat-pulldown-wide-pronated
    - reverse-grip-lat-pulldown
  evidence_notes: []
  review_status: reviewed

- id: chest-supported-row
  name: Chest-Supported Row
  summary: >-
    A horizontal pull where the bench removes lower-back and balance
    demand, pushing a back-thickness set closer to true failure.
  why_this_exists: >-
    A horizontal pull where the bench removes most of the lower-back and
    balance demand, so effort goes into the pull itself.
  body_regions: [back]
  primary_targets: [mid-back, rhomboids, mid/lower trapezius]
  secondary_targets: [lats, elbow flexors]
  physique_targets: [back-thickness]
  movement_patterns: [horizontal pull]
  equipment: [machine, bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound, low-fatigue]
  resistance_profile: >-
    Machine or bench-supported free weight; grip/handle choice (pronated,
    neutral, supinated) is a preference within this record, not a
    separate movement.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A strong mechanical-tension stimulus for back thickness is wanted
      while pushing close to failure — removing the trunk-stability demand
      means the set ends when the back gives out, not the lower back.
  less_suitable_when:
    - The hinge's added trunk and hip demand is wanted as part of the
      stimulus, which a supported row deliberately removes.
  mirror_effect: >-
    Rows build back thickness, not width — tends to show up as density and a
    "3D" stacked look viewed from the side, filling out the back between the
    spine and the shoulder blades, distinct from the under-arm flare vertical
    pulling builds.
  advantages: []
  limitations:
    - The chest pad's angle and height often don't fit every torso length well,
      and a poor fit can cap the row's range of motion regardless of how heavy
      the load is.
    - Removing the hinge also removes the trunk-and-hip training stimulus a
      free-standing row provides, so strength here doesn't fully transfer to
      unsupported pulling.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A vertical pull; a free-standing row only if it fills a different
      role.
  overlaps_with:
    - seated-cable-row
    - barbell-bent-over-row-pronated
    - t-bar-row
  evidence_notes: []
  review_status: reviewed

- id: barbell-bent-over-row-pronated
  name: Barbell Bent-Over Row (Pronated Grip)
  summary: >-
    The reference free-weight horizontal pull, the heaviest, most
    mechanical-tension-driven back-thickness stimulus available.
  why_this_exists: >-
    The reference free-weight horizontal pull, loadable with small
    increments and useful when a user wants one row that also demands
    trunk and hip control. The overhand grip is the default most people
    mean by "barbell row," and it flares the elbows wider than an
    underhand grip, biasing the upper back and rear delts somewhat more.
  body_regions: [back]
  primary_targets: [mid-back, rhomboids]
  secondary_targets: [lats, elbow flexors, spinal erectors]
  physique_targets: [back-thickness]
  movement_patterns: [horizontal pull, pronated grip]
  equipment: [barbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, fixed bar path.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The heaviest, most mechanical-tension-driven back-thickness stimulus
      available is the goal, with the hinge itself adding a secondary
      training demand on the spinal erectors.
  less_suitable_when:
    - Lower-back fatigue from other work already limits how much can
      safely be loaded, capping the mechanical-tension ceiling this
      movement can deliver.
  mirror_effect: >-
    Same thickness-building visible direction as any row — mass and density
    through the mid-back viewed from the side — and, being the heaviest
    loadable row option, often the biggest single contributor to that
    thickness.
  advantages: []
  limitations:
    - The bent-over hinge position places real demand on the lower back, which
      can become the limiting factor before the target back muscles are.
    - Technical demand is high — maintaining a neutral spine under load while
      pulling takes real practice, and poor form here carries real injury risk.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A supported row or vertical pull that does not add further spinal
      loading.
  overlaps_with:
    - reverse-grip-barbell-row
    - t-bar-row
    - chest-supported-row
  evidence_notes: []
  review_status: reviewed

