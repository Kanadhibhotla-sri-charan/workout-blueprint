  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-fatigue
  resistance_profile: Constant cable tension. A band anchored overhead (for example looped over a pull-up bar) stretches further as the hands approach the thighs, so it gets heavier through the pull and is hardest at the end, in the shortened position, unlike the even tension of a cable.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stretch-mediated, lat-isolated stimulus that doesn't depend on grip or biceps endurance is wanted, often as a pre-exhaust warm-up or a finisher after heavier pulling.
  less_suitable_when:
    - Back growth is currently limited by total heavy-pulling volume rather than needing more lat isolation — a compound pull delivers more overall stimulus per set.
  mirror_effect: Tends to show up as fullness along the lower, outer edge of the lat — the "sweep" that flares out near the sides of the torso — since that's the stretched position this movement isolates, distinct from the more general width a vertical pull builds.
  advantages: []
  limitations:
    - Load ceiling is inherently modest — the fixed-elbow, straight-arm path is a mechanically weaker position than a bent-arm pull, so this can't substitute for a heavy compound pull's overall stimulus.
    - It's easy for the shoulders to hike up or the movement to turn into a shrug-like motion under fatigue, which shifts the stimulus away from the lats.
  technique_cues:
    - Face a high pulley, hinge slightly forward at the hips, and hold a bar or rope with nearly straight arms.
    - Pull the bar down in an arc to your thighs, keeping a slight, fixed bend in the elbows.
    - Keep the shoulders down, away from the ears.
    - Let the arms rise back up until the lats stretch, without the torso moving.
  common_mistakes:
    - "Bending the elbows to push the bar down: it turns into a triceps pushdown."
    - "Shrugging the shoulders up: shifts the stimulus away from the lats."
    - "Rocking the torso to move the weight: the hips and body sway start the movement instead of the lats."
  programming_notes:
    - "Band version: loop a band over a pull-up bar or a high door anchor, step back and pull the ends down to the thighs with straight arms. Stepping further back adds resistance."
  alternatives: []
  complements:
    - A vertical or horizontal pull.
  overlaps_with:
    - dumbbell-pullover-lat-biased
  evidence_notes:
    - "No study specific to the straight-arm pulldown or lat length was located. The \"stretch-mediated\" framing draws on the broader stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) found full/longer-ROM training tends to match or beat partial-ROM training that avoids the stretch, and Wolf et al. (2023, International Journal of Strength and Conditioning) found lengthened partial-ROM training matched or exceeded full-ROM training. A later trial (Wolf et al., 2025, PubMed 39959841) found lengthened partials produced hypertrophy similar to, not clearly greater than, full ROM — so this is a well-supported general direction, not a settled, exercise-specific magnitude claim."
