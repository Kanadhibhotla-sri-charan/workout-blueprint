- id: straight-arm-pulldown
  name: Straight-Arm Pulldown
  summary: >-
    A lat-focused, cable-based option with the elbow mostly fixed, a
    stretch-mediated stimulus independent of grip or biceps endurance.
  why_this_exists: >-
    A lat-focused option with the elbow mostly fixed, which may be useful
    when elbow flexors fatigue before the lats in pulldowns and rows.
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: []
  movement_patterns: [shoulder extension]
  equipment: [cable]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-fatigue]
  resistance_profile: >-
    Constant cable tension.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stretch-mediated, lat-isolated stimulus that doesn't depend on
      grip or biceps endurance is wanted, often as a pre-exhaust warm-up or
      a finisher after heavier pulling.
  less_suitable_when:
    - Back growth is currently limited by total heavy-pulling volume
      rather than needing more lat isolation — a compound pull delivers
      more overall stimulus per set.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A vertical or horizontal pull.
  overlaps_with:
    - dumbbell-pullover-lat-biased
  evidence_notes:
    - >-
      No study specific to the straight-arm pulldown or lat length was
      located. The "stretch-mediated" framing draws on the broader
      stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020,
      SAGE Open Medicine) found full/longer-ROM training tends to match
      or beat partial-ROM training that avoids the stretch, and Wolf et
      al. (2023, International Journal of Strength and Conditioning)
      found lengthened partial-ROM training matched or exceeded full-ROM
      training. A later trial (Wolf et al., 2025, PubMed 39959841) found
      lengthened partials produced hypertrophy similar to, not clearly
      greater than, full ROM — so this is a well-supported general
      direction, not a settled, exercise-specific magnitude claim.
  review_status: draft

