- id: back-extension-45-spinal-dominant
  name: 45° Back Extension (Spinal-Extension-Dominant Execution)
  summary: >-
    A loaded hip-extension pattern executed with straighter legs and
    controlled lumbar extension, biasing the spinal erectors specifically.
  why_this_exists: >-
    A loaded hip-extension and spinal-support pattern that can be trained
    without the setup and systemic cost of a heavy deadlift. Keeping the
    legs nearly straight and allowing a small, controlled amount of lumbar
    extension through the top of the rep — rather than hinging purely from
    the hip — is what shifts this movement's emphasis onto the spinal
    erectors specifically. This is the execution this record describes;
    the hamstrings module has the same equipment used with a different
    execution for a different emphasis.
  body_regions: [back]
  primary_targets: [spinal erectors]
  secondary_targets: [glutes, hamstrings (less than the hip-hinge-dominant execution)]
  movement_patterns: [trunk extension, spinal-extension-dominant execution]
  equipment: [45-degree hyperextension bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound, low-fatigue]
  resistance_profile: >-
    Bodyweight or lightly loaded, adjustable emphasis by execution.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate mechanical-tension stimulus specifically for the spinal
      erectors is wanted, without the systemic fatigue cost of a heavy
      hinge.
  less_suitable_when:
    - The glutes and hamstrings need to be biased instead — bending the
      knees more and driving the movement from the hips, described in the
      hamstrings module's copy of this exercise, does that instead. Back
      symptoms are a stop-and-assess signal either way, not something to
      train through.
  mirror_effect: >-
    Contributes to spinal-erector definition and thickness along either side of
    the spine — the "Christmas tree" lines visible in a lean lower back — at a
    lighter load ceiling than a full deadlift, so the effect tends to be more
    modest unless it's adding volume on top of heavier hinge work.
  advantages: []
  limitations:
    - The controlled lumbar extension this execution deliberately uses is
      exactly the technique cue that's easy to overdo, so anyone new to the
      movement should build up load and range gradually rather than starting
      aggressively.
    - Loading options are limited on most equipment — a plate held to the chest
      or a light barbell across the back is usually the practical ceiling
      before stability becomes the limiter.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A hinge pattern; see the hamstrings and hips modules for overlap.
  overlaps_with:
    - "romanian-deadlift (hamstrings module)"
    - "back-extension-45-hip-dominant (hamstrings module) — same
      equipment, hip-hinge-dominant execution, hamstring/glute bias
      instead."
  evidence_notes: []
  review_status: reviewed
