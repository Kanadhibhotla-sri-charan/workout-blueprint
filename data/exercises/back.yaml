# Canonical exercise records for the back module.
# Format decided in docs/adr/0001-canonical-record-format.md.
# Schema: docs/knowledge-manual/FOUNDATION.md, "Canonical Exercise Record."
# Converted from docs/knowledge-manual/back/BACK.md.
#
# Note: the Romanian deadlift is NOT duplicated here. It is a genuinely
# identical exercise in both the hips and hamstrings prose modules (no
# execution fork, confirmed by audit), so its single canonical record
# lives in hamstrings.yaml with body_regions: [hips, hamstrings]. See
# ADR 0001. Back's conventional deadlift and quads' sumo deadlift are
# genuinely distinct movements and each keep their own record.

- id: pull-up-pronated
  name: Pull-Up (Pronated Grip)
  summary: >-
    A bodyweight vertical pull with an overhand grip, leaning most heavily
    on the lats and grip with less elbow-flexor assistance than a chin-up.
  why_this_exists: >-
    A bodyweight vertical pull that requires little equipment and scales
    through added load, tempo, or assistance. The overhand grip leans on
    the lats and grip strength more than the chin-up does.
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: [mid-back, trunk musculature, elbow flexors (less than chin-up)]
  physique_targets: [lat-width]
  movement_patterns: [vertical pull, pronated grip]
  equipment: [pull-up bar, bodyweight]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound, skill-coordination]
  resistance_profile: >-
    Bodyweight-scaled; progresses via added load, tempo, or assistance.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - A heavy, bodyweight-scaled mechanical-tension stimulus for lat width
      is the goal, with grip and upper-back strength building alongside it.
  less_suitable_when:
    - Bodyweight is too much load to complete a useful number of reps,
      capping the growth stimulus until strength improves or assistance is
      added.
  mirror_effect: >-
    This is usually the actual answer to "my lats look narrow" — vertical
    pulling like this is the primary driver of back width, the flare that shows
    up under the arms and creates the V-taper look from behind. Rows build back
    thickness, not width; if width specifically is the complaint, this family
    of movements is where to look first.
  advantages: []
  limitations:
    - Bodyweight is a large, all-or-nothing jump in load for anyone who can't
      yet do a full rep, and there's no easy way to fine-tune the resistance
      down without a band or assisted machine.
    - Grip strength commonly runs out before the lats do, especially for
      lifters who haven't built grip capacity separately.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A horizontal row selected for a distinct role.
  overlaps_with:
    - chin-up-supinated
    - lat-pulldown-wide-pronated
  evidence_notes: []
  review_status: reviewed

- id: chin-up-supinated
  name: Chin-Up (Supinated Grip)
  summary: >-
    The same bodyweight vertical pull as the pull-up, with an underhand
    grip that brings the biceps in more directly.
  why_this_exists: >-
    The same bodyweight vertical pull as the pull-up, but the underhand
    grip brings the biceps in more directly, which often lets a user
    complete more reps or add more load at the same relative lat effort.
  body_regions: [back]
  primary_targets: [lats, elbow flexors]
  secondary_targets: [mid-back, trunk musculature]
  physique_targets: [lat-width]
  movement_patterns: [vertical pull, supinated grip]
  equipment: [pull-up bar, bodyweight]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound, skill-coordination]
  resistance_profile: >-
    Bodyweight-scaled; progresses via added load, tempo, or assistance.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - The same lat-width stimulus as a pull-up is wanted but with more
      biceps assistance, often making it easier to reach a growth-effective
      rep range while still building strength.
  less_suitable_when:
    - The lats need to be isolated away from the biceps — the biceps taking
      on more of the load means less of the set's tension lands on the
      back per rep.
  mirror_effect: >-
    Same width-building visible direction as the pull-up — the under-arm flare
    that creates a V-taper from behind — though with more of each rep's tension
    shared by the biceps, so the lat-specific stimulus per rep is somewhat less
    isolated.
  advantages: []
  limitations:
    - The extra biceps involvement means some of each rep's tension lands on
      the elbow flexors rather than the back, which understates how hard the
      back itself is actually working.
    - Same bodyweight-jump problem as the pull-up — there's no fine-grained way
      to scale load down for a lifter who can't yet do a full rep.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A horizontal row selected for a distinct role.
  overlaps_with:
    - pull-up-pronated
    - lat-pulldown-wide-pronated
  evidence_notes: []
  review_status: reviewed

- id: lat-pulldown-wide-pronated
  name: Lat Pulldown (Wide, Pronated Grip)
  summary: >-
    A vertical pull with adjustable load and a wide overhand grip, the
    default most people mean by "lat pulldown."
  why_this_exists: >-
    A vertical pull with adjustable load, which makes it easier to control
    repetition ranges and progression than bodyweight pulling. The wide
    pronated grip is the default most people mean by "lat pulldown."
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: [mid-back, elbow flexors (less than supinated grip)]
  physique_targets: [lat-width]
  movement_patterns: [vertical pull, pronated grip]
  equipment: [cable]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Cable stack, small load increments.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  best_used_when:
    - Precise, progressive loading for lat-width growth is wanted without
      the all-or-nothing jumps bodyweight pulling forces, or a set needs
      to be pushed closer to failure than a pull-up safely allows.
  less_suitable_when:
    - Pulling strength has outgrown the stack's top loads, capping how much
      mechanical tension the machine can provide relative to a heavier
      bodyweight-plus-load pull-up.
  mirror_effect: >-
    Same width-building visible direction as a pull-up — the under-arm flare
    and V-taper viewed from behind — and the most common default choice for
    training it, since load is adjustable in a way bodyweight pulling isn't.
  advantages: []
  limitations:
    - It's easy to lean back and use the trunk to help complete the pull once
      the load gets heavy, which shifts some of the work away from the lats
      without feeling like a technique breakdown.
    - The seated, supported position removes core and grip demand a bodyweight
      pull would add, so strength built here transfers only partially to a
      pull-up.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A rowing pattern, and lat-focused single-joint work where elbow
      flexors limit the pull.
  overlaps_with:
    - pull-up-pronated
    - chin-up-supinated
    - reverse-grip-lat-pulldown
    - neutral-grip-lat-pulldown
  evidence_notes: []
  review_status: reviewed

