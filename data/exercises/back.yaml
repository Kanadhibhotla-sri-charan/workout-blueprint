  best_used_when:
    - Precise, progressive loading for lat-width growth is wanted without the all-or-nothing jumps bodyweight pulling forces, or a set needs to be pushed closer to failure than a pull-up safely allows.
  less_suitable_when:
    - Pulling strength has outgrown the stack's top loads, capping how much mechanical tension the machine can provide relative to a heavier bodyweight-plus-load pull-up.
  mirror_effect: Same width-building visible direction as a pull-up — the under-arm flare and V-taper viewed from behind — and the most common default choice for training it, since load is adjustable in a way bodyweight pulling isn't.
