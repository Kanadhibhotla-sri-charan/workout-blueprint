- id: conventional-deadlift
  name: Conventional Deadlift
  summary: >-
    Loads the whole posterior chain from a dead stop on the floor — the
    single heaviest mechanical-tension stimulus available for it.
  why_this_exists: >-
    Loads the entire posterior chain from a dead stop on the floor, which
    distinguishes it from hinges such as the Romanian deadlift that start
    from the top and never fully unload.
  body_regions: [back]
  primary_targets: [spinal erectors, glutes, hamstrings]
  secondary_targets: [lats, traps, grip]
  movement_patterns: [hip hinge]
  equipment: [barbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, floor start, hardest off the floor.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The single heaviest, most mechanical-tension-driven stimulus
      available for the whole posterior chain is the goal, and the
      systemic cost that comes with it can be recovered from.
  less_suitable_when:
    - Recovery is limited, or what's actually needed is back-thickness or
      lat-width growth rather than raw whole-body strength — a rack pull
      or a compound row delivers a more targeted stimulus at far less
      systemic cost.
  mirror_effect: >-
    Contributes to overall back thickness and density broadly — traps, upper
    back, and especially the spinal erectors, which in a lean physique show up
    as the "Christmas tree" lines running down either side of the spine. It's a
    whole-posterior-chain effect, not a targeted width or shape tool.
  advantages: []
  limitations:
    - The technical demand and injury stakes are higher than almost any other
      lift in this dataset — poor bar path or a rounded back under heavy load
      carries real risk.
    - Recovery cost is high relative to most other back exercises, since the
      whole posterior chain and central nervous system are taxed, not just the
      back muscles.
    - Grip is often the first thing to fail at heavy loads, which can end a set
      before the back and legs reach their true strength limit unless straps or
      a mixed grip are used.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A single-joint hamstring or glute movement that adds volume without
      the same systemic cost.
  overlaps_with:
    - rack-pull
    - "romanian-deadlift (hamstrings module) — related but distinct hinge
      that starts from the top and never fully unloads."
    - "sumo-deadlift (quads module) — same floor pull, wide stance,
      emphasis shifted toward quads and adductors."
  evidence_notes: []
  review_status: reviewed

- id: rack-pull
  name: Rack Pull
  summary: >-
    A partial-range deadlift from an elevated start, overloading the
    top-of-pull position past what a full deadlift allows.
  why_this_exists: >-
    Starting the pull from an elevated position removes the hardest, most
    technical part of a deadlift off the floor, which lets a user load
    significantly heavier weight and biases the top-of-pull musculature
    more than a full deadlift does.
  body_regions: [back]
  primary_targets: [spinal erectors, upper/mid trapezius, grip]
  secondary_targets: [glutes, hamstrings (less than a full deadlift)]
  physique_targets: [upper-traps]
  movement_patterns: [hip hinge, partial range]
  equipment: [barbell, power rack]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, elevated start, partial range of motion.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - The top-of-pull position needs overloading with more mechanical
      tension than a full deadlift allows, specifically training grip and
      upper-back strength under heavier-than-usual load.
  less_suitable_when:
    - The full-range, floor-level strength stimulus a conventional
      deadlift trains is the goal, since this movement skips that range
      entirely.
  mirror_effect: >-
    Tends to show up more in the traps and upper back than the lower-back
    erector definition a full-range deadlift builds, since the partial range
    biases the top-of-pull musculature specifically.
  advantages: []
  limitations:
    - Skipping the floor-level range means it does not build pulling strength
      or technique off the floor — it should not be mistaken for a full
      deadlift substitute.
    - The heavier loads this position allows can tempt lifters into using more
      back rounding or momentum than they would with a full-range pull, since
      the working range is shorter and the ego-load temptation is higher.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A full-range deadlift or Romanian deadlift, which covers the
      bottom-range work this movement skips.
