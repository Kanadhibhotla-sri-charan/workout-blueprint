# Canonical exercise records for the back module.
# Format decided in docs/adr/0001-canonical-record-format.md.
# Schema: docs/knowledge-manual/FOUNDATION.md, "Canonical Exercise Record."
# Converted from docs/knowledge-manual/back/BACK.md.
#
# Note: the Romanian deadlift is NOT duplicated here. It is a genuinely
# identical exercise in both the hips and hamstrings prose modules (no
# execution fork, confirmed by audit), so its single canonical record
# lives in hamstrings.yaml with body_regions: [hips, hamstrings]. See
# ADR 0001. Back's conventional deadlift and quads' sumo deadlift are
# genuinely distinct movements and each keep their own record.

- id: pull-up-pronated
  name: Pull-Up (Pronated Grip)
  summary: >-
    A bodyweight vertical pull with an overhand grip, leaning most heavily
    on the lats and grip with less elbow-flexor assistance than a chin-up.
  why_this_exists: >-
    A bodyweight vertical pull that requires little equipment and scales
    through added load, tempo, or assistance. The overhand grip leans on
    the lats and grip strength more than the chin-up does.
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: [mid-back, trunk musculature, elbow flexors (less than chin-up)]
  movement_patterns: [vertical pull, pronated grip]
  equipment: [pull-up bar, bodyweight]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound, skill-coordination]
  resistance_profile: >-
    Bodyweight-scaled; progresses via added load, tempo, or assistance.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - A heavy, bodyweight-scaled mechanical-tension stimulus for lat width
      is the goal, with grip and upper-back strength building alongside it.
  less_suitable_when:
    - Bodyweight is too much load to complete a useful number of reps,
      capping the growth stimulus until strength improves or assistance is
      added.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A horizontal row selected for a distinct role.
  overlaps_with:
    - chin-up-supinated
    - lat-pulldown-wide-pronated
  evidence_notes: []
  review_status: draft

- id: chin-up-supinated
  name: Chin-Up (Supinated Grip)
  summary: >-
    The same bodyweight vertical pull as the pull-up, with an underhand
    grip that brings the biceps in more directly.
  why_this_exists: >-
    The same bodyweight vertical pull as the pull-up, but the underhand
    grip brings the biceps in more directly, which often lets a user
    complete more reps or add more load at the same relative lat effort.
  body_regions: [back]
  primary_targets: [lats, elbow flexors]
  secondary_targets: [mid-back, trunk musculature]
  movement_patterns: [vertical pull, supinated grip]
  equipment: [pull-up bar, bodyweight]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound, skill-coordination]
  resistance_profile: >-
    Bodyweight-scaled; progresses via added load, tempo, or assistance.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - The same lat-width stimulus as a pull-up is wanted but with more
      biceps assistance, often making it easier to reach a growth-effective
      rep range while still building strength.
  less_suitable_when:
    - The lats need to be isolated away from the biceps — the biceps taking
