- id: back-extension-45-spinal-dominant
  name: 45° Back Extension (Spinal-Extension-Dominant Execution)
  summary: >-
    A loaded hip-extension pattern executed with straighter legs and
    controlled lumbar extension, biasing the spinal erectors specifically.
  why_this_exists: >-
    A loaded hip-extension and spinal-support pattern that can be trained
    without the setup and systemic cost of a heavy deadlift. Keeping the
    legs nearly straight and allowing a small, controlled amount of lumbar
    extension through the top of the rep — rather than hinging purely from
    the hip — is what shifts this movement's emphasis onto the spinal
    erectors specifically. This is the execution this record describes;
    the hamstrings module has the same equipment used with a different
    execution for a different emphasis.
  body_regions: [back]
  primary_targets: [spinal erectors]
  secondary_targets: [glutes, hamstrings (less than the hip-hinge-dominant execution)]
  movement_patterns: [trunk extension, spinal-extension-dominant execution]
  equipment: [45-degree hyperextension bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound, low-fatigue]
  resistance_profile: >-
    Bodyweight or lightly loaded, adjustable emphasis by execution.
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A moderate mechanical-tension stimulus specifically for the spinal
      erectors is wanted, without the systemic fatigue cost of a heavy
      hinge.
