- id: neutral-grip-lat-pulldown
  name: Neutral-Grip Lat Pulldown
  summary: >-
    A parallel or angled pulldown grip that avoids the shoulder's
    end-range external rotation, often the kindest grip on the joints.
  why_this_exists: >-
    A parallel or angled grip that avoids the shoulder's end-range
    external rotation a wide pronated grip asks for, which many find is
    the kindest grip on the shoulders and elbows.
  body_regions: [back]
  primary_targets: [lats]
  secondary_targets: [mid-back, elbow flexors (between pronated and supinated)]
  movement_patterns: [vertical pull, neutral grip]
  equipment: [cable]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Cable stack, small load increments.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: medium
  best_used_when:
    - Shoulder or elbow discomfort is what actually ends a set before the
      lats are meaningfully fatigued — the neutral grip removes that
      limiter and lets more effort go toward a lat-width stimulus.
  less_suitable_when:
    - Shoulder and elbow comfort aren't limiting factors, in which case a
      pronated or supinated grip may deliver a more specific bias without
