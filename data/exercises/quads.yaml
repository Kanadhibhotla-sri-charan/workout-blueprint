- id: sumo-deadlift
  name: Sumo Deadlift
  summary: >-
    A wide-stance floor pull with real quad and adductor involvement and
    less lower-back range than a conventional deadlift.
  why_this_exists: >-
    A wide stance with the toes turned out and the hands gripping inside
    the knees shortens the range of motion and keeps the torso more
    upright than a conventional deadlift, shifting the demand away from
    the lower back and toward the quads and adductors — enough that it's
    recorded here rather than with the conventional deadlift in the back
    module.
  body_regions: [quads]
  primary_targets: [quads, adductors]
  secondary_targets: [glutes, hamstrings, spinal erectors, lats, traps, grip]
  movement_patterns: [hip hinge, wide stance]
  equipment: [barbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, floor start, wide stance, shorter range of
    motion than a conventional deadlift.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A maximal-load pull is wanted with real quad and adductor
      involvement and less lower-back range than a conventional deadlift,
      or torso or arm length makes the conventional stance's range
      awkward.
  less_suitable_when:
    - Hip external-rotation mobility is limiting, which can push stress
      onto the knees or hips instead of the intended muscles, or the
      fuller hip-hinge range and greater spinal-erector demand the
      conventional deadlift provides is wanted instead.
  mirror_effect: ""
