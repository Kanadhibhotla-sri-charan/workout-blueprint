- id: sumo-squat
  name: Sumo Squat
  summary: >-
    A wide stance changes joint angles enough to bring the adductors in
    as a real mechanical-tension target, not just a stabilizer.
  why_this_exists: >-
    A wide stance with the toes turned out changes the joint angles at
    the hip and knee, bringing the adductors into the squat as a real
    mechanical-tension target rather than just a stabilizer, and often
    allows a more upright torso than a shoulder-width stance.
  body_regions: [quads]
  primary_targets: [quads, adductors]
