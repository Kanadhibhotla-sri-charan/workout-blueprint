- id: bulgarian-split-squat-knee-dominant
  name: Bulgarian Split Squat (Short-Stance, Knee-Dominant Execution)
  summary: >-
    A short-stance, knee-dominant unilateral pattern biasing the quads,
    distinct from the hips module's long-stance version.
  why_this_exists: >-
    Loads one leg through a long range with a fraction of the absolute
    load, which suits limited equipment and reveals side-to-side
    differences. Setting the front foot closer under the torso and
    letting the knee travel forward over the toes — rather than sinking
    the hips straight down and back — is what shifts this movement's
    emphasis onto the quads specifically. This is the stance and
    execution this record describes; the hips module has the same
    exercise with a longer stance for a different emphasis.
  body_regions: [quads]
  primary_targets: [quads]
  secondary_targets: [glutes (less than the hip-dominant execution), adductors]
  movement_patterns: [unilateral knee-dominant, short-stance execution]
  equipment: [dumbbell, barbell]
  exercise_type: compound
  laterality: unilateral
  coverage_categories: [unilateral]
  resistance_profile: >-
    Free-weight profile, short stance.
  stability_demand: high
  skill_demand: medium
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A strong per-side, mechanical-tension stimulus for the quads is
      specifically wanted, or a side-to-side strength gap needs closing.
  less_suitable_when:
    - The glutes and hamstrings need to be biased instead — a longer
      stance with the hips sinking straight down and back, described in
      the hips module's copy of this exercise, does that instead. Balance
      limiting the set before the target muscles are fatigued is also a
      sign to check load or stance before adding more.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A bilateral squat or press.
  overlaps_with:
    - "bulgarian-split-squat-hip-dominant (hips module)"
    - smith-machine-bulgarian-split-squat
    - static-lunge
    - reverse-lunge
    - walking-lunge
  evidence_notes: []
  review_status: draft

