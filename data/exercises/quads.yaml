  evidence_notes: []
  review_status: reviewed

- id: front-squat
  name: Front Squat
  summary: >-
    The front-loaded bar position keeps the torso more upright, shifting
    more mechanical-tension demand onto the quads than a back squat.
  why_this_exists: >-
    The front-loaded bar position keeps the torso more upright than a
    back squat, which shifts more of the demand onto the quads and
    changes the technical and mobility requirements.
  body_regions: [quads]
  primary_targets: [quads]
  secondary_targets: [glutes, trunk musculature]
  physique_targets: [quads]
  aesthetic_characteristics: [high-loadable]
  movement_patterns: [squat / knee-dominant]
  equipment: [barbell, rack]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, front-rack position.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A heavy, mechanical-tension squat stimulus is wanted with more of
      the load specifically directed at the quads than a back squat
      provides.
  less_suitable_when:
    - Wrist or shoulder mobility can't support the rack position, capping
      how much load can actually be used before form breaks down.
  mirror_effect: >-
    Similar visible direction to a back squat — front-of-thigh and glute mass —
    but the more upright torso shifts the balance a little more toward quad-
    specific development relative to the glutes.
  advantages: []
  limitations:
    - The front-rack position demands real wrist, shoulder, and thoracic
      mobility, and lifters who lack it often can't hold the position long
      enough to complete a heavy set.
    - Load capacity is meaningfully lower than a back squat's, since the front-
      rack position and upright torso become the limiting factor before the
      legs' full strength does.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
