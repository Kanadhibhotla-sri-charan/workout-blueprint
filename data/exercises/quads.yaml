- id: back-squat
  name: Back Squat
  summary: >-
    The main loadable knee-dominant pattern, the single heaviest
    mechanical-tension stimulus available for the quads and glutes.
  why_this_exists: >-
    The main loadable knee-dominant pattern, and the reference point most
    other quad work is compared against.
  body_regions: [quads]
  primary_targets: [quads, glutes]
  secondary_targets: [adductors, erectors, trunk musculature]
  physique_targets: [quads]
  aesthetic_characteristics: [high-loadable]
  movement_patterns: [squat / knee-dominant]
  equipment: [barbell, rack]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - The single heaviest, most mechanical-tension-driven quad-and-glute
      stimulus available is the goal, with strength as a direct byproduct.
  less_suitable_when:
    - Recovery is limited, or quad-specific volume is wanted without the
      whole-body systemic fatigue this movement brings.
  mirror_effect: >-
    Tends to show up as overall mass through the front of the thigh and the
    glutes together — this is the primary size driver for the whole leg, not a
    shaping tool for any one part of it.
  advantages: []
  limitations:
    - Technical demand is high — bar position, depth, and bracing all have to
      come together, and poor technique carries real injury risk at heavy
      loads.
    - Recovery cost is high relative to most other quad movements, since it
      taxes the whole body and central nervous system, not just the legs.
    - Ankle, hip, or thoracic mobility limits can cap usable depth or bar
      position well before the quads reach their true strength limit.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A single-joint knee-extension movement, or a stable machine pattern.
  overlaps_with:
    - front-squat
    - hack-squat
    - leg-press
    - smith-machine-squat
  evidence_notes: []
  review_status: reviewed

- id: smith-machine-squat
  name: Smith Machine Squat
  summary: >-
    A fixed vertical bar path removing balance and bracing demand, well
    suited to training closer to failure without a spotter.
  why_this_exists: >-
    A fixed vertical bar path that removes the balance and bracing demand
    of a free barbell squat, letting a user train closer to failure
    without a spotter.
  body_regions: [quads]
  primary_targets: [quads, glutes]
  secondary_targets: [adductors]
  physique_targets: [quads]
  aesthetic_characteristics: [high-loadable]
  movement_patterns: [squat / knee-dominant]
  equipment: [smith machine]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [stable-compound]
  resistance_profile: >-
    Fixed vertical rail path; free-weight-like load curve.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - A quad-and-glute set is wanted pushed closer to true failure than
      could safely be handled unspotted with a free barbell.
  less_suitable_when:
    - The fixed vertical path doesn't match a user's natural squat path,
      which can shift stress onto the knees or lower back rather than the
      target muscles.
  mirror_effect: >-
    Same visible direction as the free-weight back squat — overall front-of-
    thigh and glute mass — since the fixed rail changes balance demand, not
    which muscles carry the load.
  advantages: []
  limitations:
    - The fixed vertical path doesn't match every lifter's natural squat arc,
      and a mismatch can shift stress onto the knees or lower back instead of
      the target muscles.
    - Removing the balance and bracing demand also removes the stabilizer
      training a free-weight squat provides, so strength here transfers only
      partially back to an unassisted squat.
