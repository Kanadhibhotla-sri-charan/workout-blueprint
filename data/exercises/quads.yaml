    - hack-squat
  evidence_notes: []
  review_status: reviewed

- id: sumo-squat
  name: Sumo Squat
  summary: >-
    A wide stance changes joint angles enough to bring the adductors in
    as a real mechanical-tension target, not just a stabilizer.
  why_this_exists: >-
    A wide stance with the toes turned out changes the joint angles at
    the hip and knee, bringing the adductors into the squat as a real
    mechanical-tension target rather than just a stabilizer, and often
    allows a more upright torso than a shoulder-width stance.
  body_regions: [quads]
  primary_targets: [quads, adductors]
  secondary_targets: [glutes]
  physique_targets: [quads]
  aesthetic_characteristics: [high-loadable]
  movement_patterns: [squat / knee-dominant, wide stance]
  equipment: [barbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, wide stance.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A squat variation is wanted that trains the adductors directly, or
      torso length or hip mobility makes a more upright squat more
      comfortable than a shoulder-width stance.
  less_suitable_when:
    - Hip external-rotation mobility is limiting, which can push stress
      onto the knees or lower back instead of the intended muscles.
  mirror_effect: >-
    Tends to add inner-thigh (adductor) fullness alongside the usual quad mass,
    changing the leg's profile from the front more than a shoulder-width squat
    does — a fuller look through the inner thigh, not just the front.
  advantages: []
  limitations:
    - Hip external-rotation mobility genuinely limits how wide and how deep the
      stance can go, and forcing it without that mobility can push stress onto
      the knees.
    - The wide stance is a real technical departure from a standard squat, so
      it takes its own practice rather than transferring automatically from
      shoulder-width squatting experience.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A narrower-stance squat, which trains the adductors less directly.
  overlaps_with:
    - back-squat
    - sumo-deadlift
  evidence_notes: []
  review_status: reviewed

- id: sumo-deadlift
  name: Sumo Deadlift
  summary: >-
    A wide-stance floor pull with real quad and adductor involvement and
    less lower-back range than a conventional deadlift.
  why_this_exists: >-
    A wide stance with the toes turned out and the hands gripping inside
    the knees shortens the range of motion and keeps the torso more
    upright than a conventional deadlift, shifting the demand away from
    the lower back and toward the quads and adductors — enough that it's
    recorded here rather than with the conventional deadlift in the back
    module.
  body_regions: [quads]
  primary_targets: [quads, adductors]
  secondary_targets: [glutes, hamstrings, spinal erectors, lats, traps, grip]
  physique_targets: [quads]
  aesthetic_characteristics: [high-loadable]
  movement_patterns: [hip hinge, wide stance]
  equipment: [barbell]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, floor start, wide stance, shorter range of
    motion than a conventional deadlift.
  stability_demand: high
  skill_demand: high
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A maximal-load pull is wanted with real quad and adductor
      involvement and less lower-back range than a conventional deadlift,
      or torso or arm length makes the conventional stance's range
      awkward.
  less_suitable_when:
    - Hip external-rotation mobility is limiting, which can push stress
      onto the knees or hips instead of the intended muscles, or the
      fuller hip-hinge range and greater spinal-erector demand the
      conventional deadlift provides is wanted instead.
  mirror_effect: >-
    Similar visible direction to the sumo squat — quad and inner-thigh mass
    together — with less contribution to lower-back erector thickness than a
    conventional deadlift, since the shorter range and more upright torso ask
    less of the lower back.
  advantages: []
  limitations:
    - Hip mobility requirements are real and specific — a lifter without
      adequate external rotation can't set up the stance properly no matter how
      much they load the bar.
    - The technical demand is high, and the wide stance plus close grip inside
      the knees takes real practice to coordinate safely under heavy load.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A single-joint hamstring or glute movement.
  overlaps_with:
    - "conventional-deadlift (back module)"
    - sumo-squat
  evidence_notes: []
  review_status: reviewed

