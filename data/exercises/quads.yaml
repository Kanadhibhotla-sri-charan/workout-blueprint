- id: reverse-nordic-curl
  name: Reverse Nordic Curl
  summary: >-
    Loads knee extension with the hip extended, so the rectus femoris
    works in a lengthened position — a strong stretch-mediated stimulus.
  why_this_exists: >-
    Loads knee extension with the hip extended, so the rectus femoris
    works in a lengthened position, and it needs almost no equipment.
  body_regions: [quads]
  primary_targets: [quads (emphasis on the rectus femoris)]
  secondary_targets: []
  physique_targets: [quads]
  movement_patterns: [knee extension, hip extended]
  equipment: [bodyweight]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [low-setup, lengthened-position-emphasis, skill-coordination]
  resistance_profile: >-
    Bodyweight, scales by range controlled.
  stability_demand: medium
  skill_demand: high
  setup_time: low
  fatigue_cost: medium
  best_used_when:
    - A strong stretch-mediated stimulus is wanted specifically for the
      rectus femoris, in a position no common machine or squat variation
      reaches.
  less_suitable_when:
    - Knee tolerance is limiting, or the range can't yet be controlled —
      this movement should be scaled gradually rather than loaded
      aggressively from the start.
  mirror_effect: >-
    Tends to contribute to fullness down the center of the front thigh
    specifically, since the rectus femoris this targets runs down that central
    line — adds to the quad's central sweep rather than the outer teardrop
    shape a leg extension emphasizes.
  advantages: []
  limitations:
    - The knee experiences real end-range stress in this position, and lifters
      with existing knee sensitivity may not tolerate it well even at a
      controlled pace.
    - There's a real skill floor — many lifters can't control any meaningful
      range at all when starting out, and loading it too aggressively before
      building control raises injury risk.
    - There's no simple way to add external load once bodyweight control is
      mastered, unlike a barbell-based leg exercise.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A loadable squat or press pattern.
  overlaps_with:
    - leg-extension
  evidence_notes:
    - >-
      No study using this specific exercise was located, but the
      underlying principle — that training the quads at a longer muscle
      length (deep hip/knee flexion) drives more growth than training at
      a shorter length — has direct support from squat-depth research.
      Bloomquist et al. (2013) ran a 12-week controlled trial comparing
      shallow squats (~60° knee flexion) against deep squats (~120° knee
      flexion): the deep-squat group gained quadriceps cross-sectional
      area across the entire thigh, while the shallow-squat group only
      grew measurably in the upper thigh. This is a squat-depth finding,
      not a reverse-Nordic-curl finding, but it's the same underlying
      variable — how lengthened the quads get under load — that this
      record's rectus-femoris claim rests on. It's also consistent with
      the broader stretch-mediated hypertrophy literature: Schoenfeld &
      Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023,
      International Journal of Strength and Conditioning) found training
      at longer muscle length tends to match or beat training that
      avoids the stretch, though a later trial (Wolf et al., 2025,
      PubMed 39959841) found the advantage over full ROM is smaller than
      earlier work suggested.
  review_status: reviewed
