  equipment:
    - smith machine
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - stable-compound
    - lengthened-position-emphasis
  resistance_profile: Fixed vertical rail path; free-weight-like load curve.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - The RDL's stretch-mediated stimulus is wanted while still learning to control the hinge, since the fixed rail removes the bar-path variable that most often breaks technique down under load.
  less_suitable_when:
    - Hip-to-torso proportions need more depth than the fixed rail allows, or the bar needs to accommodate individual leverages the way a free bar can.
  mirror_effect: Same visible direction as the free-bar Romanian deadlift — combined hamstring and glute fullness viewed from behind — since the fixed rail changes how the movement is learned, not which muscles end up carrying the load.
  advantages: []
  limitations:
    - The fixed rail path doesn't match every lifter's natural hip-hinge arc, which can force compensations at the knees or hips instead of removing them.
    - Once the bar-path-control training wheels are no longer needed, there's little further benefit over the free-bar version, so it's mainly useful as a stepping stone rather than a long-term staple.
