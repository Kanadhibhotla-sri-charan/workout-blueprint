  limitations:
    - Bodyweight alone stops being challenging quickly for trained lifters, and loading it from the floor (a dumbbell or plate on the hips) caps out well below what a barbell hip thrust allows.
    - The range of motion is shorter than a hip thrust's because the shoulders stay on the floor, so the hips start from less bend.
    - The hamstrings readily take over if the feet sit too far from the hips, and that isn't always obvious from how the rep feels.
  technique_cues:
    - Lie on your back with knees bent and feet flat about hip width, heels close enough that your fingertips can just touch them.
    - Tuck the pelvis slightly and keep the ribs down before you lift.
    - Drive through the heels to lift the hips until knees, hips and shoulders form a straight line.
    - Squeeze the glutes and hold the top for one to two seconds, then lower until the glutes lightly touch the floor.
  common_mistakes:
    - "Arching the lower back to get the hips higher: the spine extends instead of the hips, so the lower back works and the glutes don't."
    - "Feet too far from the hips: the hamstrings take over and often cramp before the glutes have done much."
    - "Pushing through the toes: shifts work toward the quads and takes tension off the glutes."
    - "Dropping straight back down: skips the controlled lowering, which is half of each rep's glute work."
  programming_notes:
    - "Progress in this order before loading: a pause at the top, then single-leg bridges, then a dumbbell or plate on the hips. Move to a hip thrust once a bench is available and those stop being challenging."
    - "The barbell version is the same movement with a padded bar rolled over the hips: it allows far more load than a dumbbell, but the shoulders stay on the floor, so the range is still shorter than a barbell hip thrust's."
  alternatives: []
  complements:
    - Glute work in the lengthened, hip-bent position, such as Romanian deadlifts or long-stance split squats.
  overlaps_with:
    - hip-thrust
