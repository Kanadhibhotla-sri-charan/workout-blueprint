  evidence_notes: []
  review_status: reviewed

- id: standing-cable-hip-flexion
  name: Standing Cable Hip Flexion
  summary: >-
    Trains hip flexion under load, which most lower-body routines leave
    entirely to stretching.
  why_this_exists: >-
    Trains hip flexion under load, which most lower-body routines leave
    entirely to stretching.
  body_regions: [hips]
  primary_targets: [hip flexors]
  secondary_targets: [rectus abdominis]
  movement_patterns: [hip flexion]
  equipment: [cable]
  exercise_type: isolation
  laterality: unilateral
  coverage_categories: [isolation, low-fatigue]
  resistance_profile: >-
    Cable stack.
  stability_demand: low
  skill_demand: low
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - Hip-flexor strength and size are wanted for running, kicking, or
      knee-raise work — a specific, secondary role rather than a routine
      staple.
  less_suitable_when:
    - Session priorities haven't yet covered the larger movements that
      deliver most of a lower-body routine's growth stimulus.
  mirror_effect: ""
  advantages: []
  limitations:
    - The hip flexors are a small muscle group relative to most compound lower-
