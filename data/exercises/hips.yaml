- id: copenhagen-plank
  name: Copenhagen Plank (Adduction)
  summary: A side plank with the top leg on a bench, raising and lowering the body to load the adductors directly with no machine.
  why_this_exists: The only other direct adductor exercise in the library needs a hip-adduction machine. The Copenhagen variation loads the adductors hard with bodyweight and a bench, scales from a short lever (knee on the bench) to a long lever (ankle on the bench), and is the exercise behind a trial that reduced groin problems in football players (see evidence_notes).
  body_regions:
    - hips
  primary_targets:
    - adductors (top leg)
  secondary_targets:
    - obliques and lateral trunk
    - bottom-leg hip abductors
  physique_targets:
    - adductors
  functional_goals:
    - hip-stability
  movement_patterns:
    - hip adduction
    - side-plank support
    - bodyweight lever
  equipment:
    - bodyweight
    - bench
  exercise_type: isolation
  laterality: unilateral
  coverage_categories:
    - isolation
    - low-setup
    - equipment-limited-substitute
  resistance_profile: "Bodyweight lever: the farther the support point is from the hip (knee, then ankle), the heavier the load. Hardest at the top with the body in a straight line."
  stability_demand: medium
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - No adduction machine is available and the adductors need direct work.
    - Groin resilience matters, for example in sports with sprinting, kicking or quick changes of direction.
  less_suitable_when:
    - There's current or recent groin pain — the long-lever version loads the adductors heavily and has to be built up to.
    - Small, finely adjustable load increases are wanted — the lever steps are large.
  mirror_effect: Tends to show up, alongside other leg training, as fuller inner thighs from the front — inner-thigh appearance depends heavily on body composition, so treat this as shaping the adductors rather than changing the look on its own.
  advantages: []
  limitations:
    - Load progresses in large jumps (short lever to long lever), which can be too big a step without an in-between option.
    - Bench height and body length have to roughly match for a clean straight-line position, and not every bench allows it.
    - The bottom shoulder carries the body on the forearm, so shoulder discomfort can end a set before the adductors are worked.
  technique_cues:
    - "Lie on your side propped on the bottom forearm, elbow under the shoulder, with the top leg on the bench: inner knee for the short lever, inner ankle for the long lever."
    - Press the top leg down into the bench to lift the hips until the body is straight from head to feet.
    - Bring the bottom leg up to meet the bench underneath, then lower it as you lower the hips back toward the floor.
    - Keep the hips stacked and the body facing straight ahead; finish all reps, then switch sides.
  common_mistakes:
    - "Hips sagging or the body rotating toward the floor: the trunk and shoulder hold the position and the adductors do less."
    - "Starting with the long-lever version: loads the groin heavily before the adductors are ready — the trial programme built up through easier levels first."
    - "Bottom shoulder sinking away from the elbow: loads the shoulder joint instead of keeping it stacked and stable."
  programming_notes:
    - "Progress lever length before anything else: short lever (knee on the bench) until the planned reps are easy, then long lever (ankle on the bench). A few seconds' hold at the top is a middle step between the two."
  alternatives: []
  complements:
    - Hip abduction work, so both sides of the hip are trained directly.
  overlaps_with:
    - hip-adduction
  evidence_notes:
    - "Harøy J, et al. 'The Adductor Strengthening Programme prevents groin problems among male football players: a cluster-randomised controlled trial.' Br J Sports Med 2019;53(3):150-157 (doi:10.1136/bjsports-2017-098937). 652 semi-professional players on 35 teams; the intervention was one Copenhagen adduction exercise with three progression levels. Average groin-problem prevalence was 13.5% vs 21.3% in controls (OR 0.59, 95% CI 0.40-0.86). Evidence quality: one well-designed randomised trial in male footballers, supporting injury-prevention value in that population. It did not measure muscle size, so it says nothing about this record's inner-thigh appearance framing."
  review_status: reviewed
