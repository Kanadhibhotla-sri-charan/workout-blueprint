- id: hip-thrust
  name: Hip Thrust
  summary: Loads hip extension where the hip is already straight — the strongest available shortened-position, glute-specific stimulus.
  why_this_exists: Loads hip extension where the hip is already straight, a position squats and hinges load least.
  body_regions:
    - hips
  primary_targets:
    - gluteus maximus
  secondary_targets:
    - hamstrings
    - quads
  physique_targets:
    - gluteus-maximus
  movement_patterns:
    - hip extension
    - shortened range (hip fully extended)
  equipment:
    - barbell
    - bench
    - hip-thrust machine
    - smith machine
  equipment_setups:
    - [barbell, bench]
    - [hip-thrust machine]
    - [smith machine, bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - heavy-compound
    - shortened-position-emphasis
  resistance_profile: A barbell across the hips is the default loadable version; a dedicated hip-thrust machine or a Smith machine both offer a fixed path, which some find more comfortable than balancing a free barbell.
  stability_demand: medium
  skill_demand: medium
  setup_time: high
  fatigue_cost: medium
  best_used_when:
    - The strongest available shortened-position stimulus specifically for the glutes is wanted — by EMG, not necessarily by measured growth (see evidence_notes) — without the spinal loading a hinge adds.
  less_suitable_when:
    - A stretch-mediated stimulus is the priority instead — a hinge pattern loads the lengthened position this movement mostly skips.
  mirror_effect: Tends to show up as glute roundness and a fuller "shelf" from the side — projection out from the lower back — most noticeable in a standing, hip- extended posture rather than only when the glutes are actively flexed, since that's the exact position this movement trains hardest.
  advantages: []
  limitations:
    - Setup is genuinely awkward without a dedicated machine — rolling a loaded barbell into position across the hips takes real practice and a pad to avoid bruising.
    - Barbell versions cap out at what the lifter's hip flexibility and bar comfort allow before the movement breaks down, well before the glutes reach their true strength limit for some lifters.
    - The shortened top position that gives this exercise its value also means the resistance is lightest at the bottom, so mechanical tension isn't constant through the range.
  technique_cues:
    - Sit with the bench edge just below the shoulder blades, the bar padded across the hip crease, and the feet flat about hip width.
    - Place the feet so the shins are vertical at the top of the rep.
    - Tuck the chin and keep the ribs down, then drive through the heels until the torso and thighs form a straight line.
    - Squeeze the glutes and hold the top for a second before lowering.
  common_mistakes:
    - "Arching the lower back to get the bar higher: the spine extends instead of the hips, moving load from the glutes to the lower back."
    - "Feet too far forward or too close: too far shifts work to the hamstrings, too close to the quads."
    - "Short reps near the top only: the hips should travel from fully bent to fully extended every rep."
  programming_notes: []
  alternatives: []
  complements:
    - romanian-deadlift (hamstrings module)
  overlaps_with: []
  evidence_notes:
    - "The \"strongest\" framing needs a real caveat, not just a citation. EMG support is strong: a comparison of the back squat and barbell hip thrust (Contreras et al.-era EMG work) found the hip thrust produced roughly 2-3x the gluteus maximus activation of a back squat at comparable relative loads, consistent with the horizontal load vector peaking exactly at full hip extension. But a 2023 MRI hypertrophy trial (Plotkin et al., PMC10593473, bioRxiv/Sports Medicine) training hip thrust vs. back squat at equated volume found the two produced similar gluteal hypertrophy despite that large EMG gap — squats even produced somewhat greater thigh growth. This is a clear case of EMG and actual measured growth not correlating, so \"strongest\" is fair to say about mechanical tension/EMG in this specific shortened position, but should not be read as \"produces more glute growth than other patterns\" — the hypertrophy evidence doesn't support that stronger claim."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=xDmFkJxPzeM
  video_creator: Jeff Nippard
  video_title: "How To Build Great Glutes with Perfect Hip Thrust Technique (Fix Mistakes!)"
  video_status: verified
  video_verified_on: "2026-08-28"
  video_verification_method: metadata
- id: smith-machine-romanian-deadlift
  name: Smith Machine Romanian Deadlift
  summary: Fixing the bar to a vertical rail keeps it automatically close to the body, easing the technical cue beginners struggle with most in a free-bar RDL.
  why_this_exists: Fixing the bar to a vertical rail keeps it automatically close to the body through the hinge, which is the technical cue beginners most often struggle to hold with a free bar; this makes the pattern easier to groove before adding a free bar. Unlike a row, an RDL's correct bar path is already close to vertical, so the fixed rail helps rather than fights it.
  body_regions:
    - hips
  primary_targets:
    - glutes
    - hamstrings
  secondary_targets:
    - spinal erectors
  physique_targets:
    - gluteus-maximus
  movement_patterns:
