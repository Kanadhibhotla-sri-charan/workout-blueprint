  resistance_profile: >-
    Machine.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A direct growth stimulus for the adductors is wanted that squatting
      patterns only provide as a side effect, or a routine heavy in
