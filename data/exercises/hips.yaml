- id: bulgarian-split-squat-hip-dominant
  name: Bulgarian Split Squat (Long-Stance, Hip-Dominant Execution)
  summary: A long-stance, hip-dominant unilateral pattern biasing the glutes and hamstrings, distinct from the quads module's short-stance version.
  why_this_exists: A unilateral pattern that loads the hip through a long range with much less absolute load than a bilateral squat. Setting the front foot further out in front, keeping the torso upright, and letting the hips sink straight down and back — rather than letting the front knee travel forward — is what shifts this movement's emphasis onto the glutes and hamstrings specifically. This is the stance and execution this record describes; the quads module has the same exercise with a shorter stance for a different emphasis.
  body_regions:
    - hips
  primary_targets:
    - glutes
  secondary_targets:
    - hamstrings
    - quads (less than the knee-dominant execution)
    - adductors
  physique_targets:
    - gluteus-maximus
  movement_patterns:
    - unilateral hip-dominant
    - long-stance execution
  equipment:
    - dumbbell
    - barbell
    - bench
  equipment_setups:
    - [dumbbell, bench]
    - [barbell, bench]
  exercise_type: compound
  laterality: unilateral
  coverage_categories:
    - unilateral
  resistance_profile: Free-weight profile, long stance.
  stability_demand: high
  skill_demand: medium
  setup_time: medium
  fatigue_cost: high
  best_used_when:
    - A strong per-side, stretch-mediated stimulus for the glutes and hamstrings is specifically wanted, or a side-to-side strength gap needs closing through focused per-leg volume.
  less_suitable_when:
    - The quads need to be biased instead — a shorter stance with the knee traveling forward, described in the quads module's copy of this exercise, does that instead. Balance limiting the set before the target muscles are fatigued is also a sign to check load or stance before adding more.
  mirror_effect: Similar visible direction to a hip thrust or RDL — glute roundness, with some hamstring fullness alongside it — but built and visible one side at a time, which is what makes it useful for closing a visible left-right glute size difference the bilateral versions can't target directly.
  advantages: []
  limitations:
    - Balance and stability demand is high, which for many lifters becomes the limiting factor before the glutes or hamstrings are meaningfully fatigued.
    - The rear-foot-elevated setup is genuinely awkward to get into and adjust, adding real setup time and a fall risk that a bilateral movement doesn't have.
    - Keeping the hip-dominant technique consistent under fatigue is harder than it looks — the knee tends to drift forward late in a set, sliding the emphasis toward the quads.
  technique_cues:
    - "Take a long stance: step far enough forward from the bench that the front shin can stay close to vertical at the bottom."
    - Lean the torso forward over the front thigh as you descend, keeping the back flat. This lean is what makes it hip-dominant.
    - Sink down and back until the front thigh is about parallel and you feel the stretch in the front-leg glute.
    - Drive up through the front heel and midfoot; the rear foot is only there for balance.
  common_mistakes:
    - "Front knee sliding forward as the set fatigues: the work shifts to the quads and it becomes the knee-dominant version."
    - "Staying bolt upright: removes the hip bend that loads the glutes and hamstrings in this variation."
    - "Pushing hard off the rear foot: offloads the front leg and wastes the single-leg stimulus."
  programming_notes:
    - Start each set with the weaker leg and match its reps on the stronger side, so a side-to-side gap shrinks rather than grows.
  alternatives: []
  complements:
    - A bilateral squat or hinge.
  overlaps_with:
    - bulgarian-split-squat-knee-dominant (quads module)
    - smith-machine-bulgarian-split-squat (quads module)
  evidence_notes:
    - "No study specific to this movement was located. The \"stretch- mediated\" framing draws on the general stretch-mediated hypertrophy literature: Schoenfeld & Grgic (2020, SAGE Open Medicine) and Wolf et al. (2023, International Journal of Strength and Conditioning) found training at longer muscle length tends to match or beat training that avoids the stretch, though a later trial (Wolf et al., 2025, PubMed 39959841) found the advantage over full ROM is smaller than earlier work suggested. The long-stance execution's hip-flexion depth is what the claim is actually about, not anything unique to this exercise's other properties."
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=pxV1o3cxJUw
  video_creator: AFPTnorge
  video_title: Bulgarian Split-Squat (Hip Dominant)
  video_status: verified
  video_verified_on: "2026-08-28"
  video_verification_method: metadata
- id: cable-kickback-glute
  name: Cable Kickback
  summary: A single-joint hip-extension option, a low-fatigue, pump-oriented glute finisher.
  why_this_exists: A single-joint hip-extension option that adds glute work without further loading the knees, spine, or trunk.
  body_regions:
    - hips
  primary_targets:
    - gluteus maximus
  secondary_targets: []
  physique_targets:
    - gluteus-maximus
  movement_patterns:
    - hip extension
  equipment:
    - cable
  exercise_type: isolation
  laterality: unilateral
  coverage_categories:
    - isolation
    - low-fatigue
  resistance_profile: Cable stack, unilateral.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A low-fatigue, pump-oriented glute finisher is wanted late in a session, when heavier compound work has already used up most of the available recovery budget.
  less_suitable_when:
    - The lower back extends instead of the hip, shifting the stimulus away from the glute and onto the spine.
  mirror_effect: A minor, finishing-touch effect at best — some added glute pump and roundness late in a session, but the light, single-joint loading here isn't enough on its own to be a primary driver of visible glute size or shape.
  advantages: []
  limitations:
    - The single-joint, unilateral setup means load per side is inherently light — this isn't a movement that can substitute for a compound's overall stimulus.
    - It's very easy to substitute lower-back extension for hip extension, especially as fatigue sets in, which shifts the stimulus away from the target muscle without feeling obviously wrong.
  technique_cues:
    - Attach an ankle cuff, face the stack, and hinge slightly forward holding the frame, with the standing knee softly bent.
    - Drive the working leg back by squeezing the glute, keeping the knee slightly bent and the pelvis square to the stack.
    - Stop when the hip is fully extended, just behind the body, and hold for a second.
    - Keep the lower back still; the hip should be the only joint moving.
  common_mistakes:
    - "Arching the lower back to kick higher: the extra range comes from the spine, not the hip, and work moves off the glute."
    - "Rotating the pelvis open as the leg goes back: lets the lower back and hip flexors substitute."
    - "Swinging the leg: with loads this light, momentum quickly does most of the work."
  programming_notes: []
  alternatives: []
  complements:
    - A heavy hip-extension movement.
