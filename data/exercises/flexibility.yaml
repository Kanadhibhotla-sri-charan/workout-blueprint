  training_mode: mobility-hold
  when:
    - post_session
    - rest_day
  resistance_profile: Bodyweight; how far the hips sit back sets the depth of the stretch.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 1
    seconds_per_set: 40
    rest_seconds: [15, 30]
    per_side: false
    superset_friendly: true
  best_used_when:
    - Overhead reach and upper-back extension are wanted after training or on a rest day.
  less_suitable_when:
    - The shoulders are irritated in a fully overhead position; start with the doorway pec stretch or the cross-body stretch instead.
  mirror_effect: Not a physique exercise; it builds overhead reach and upper-back extension.
  advantages: []
  limitations:
    - The lower back can arch to fake depth, so the ribs need to stay down.
    - It needs a bench or similar raised surface at about knee to hip height.
  technique_cues:
    - Kneel facing a bench with the elbows on its edge, shoulder width apart, and the palms together.
    - Sit the hips back toward the heels until the arms are overhead relative to the body.
    - Let the chest sink gently toward the floor while keeping the ribs drawn in.
    - Bend the elbows so the hands drop behind the head to deepen the stretch, and breathe slowly.
  common_mistakes:
    - 'Arching the lower back: the stretch moves out of the upper back.'
    - 'Elbows flaring wide: the lat stretch is lost.'
    - Forcing the chest down into pain at the front of the shoulder.
  programming_notes:
    - Holding a light stick or band between the hands helps keep the elbows narrow.
  alternatives: []
  complements:
