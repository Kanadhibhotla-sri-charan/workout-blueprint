# Flexibility and recovery (badminton-oriented) exercises — flexibility expansion, 2026-10.
# Every record here carries a training_mode, so it is recommended only for the
# functional goals it lists and never appears in physique-target or region answers.

- id: thoracic-open-book
  name: Thoracic Open Book
  summary: Lying on one side with the knees bent and the arms together, opening the top arm across the body to rotate the upper back.
  why_this_exists: Overhead clears and smashes need the upper back to rotate freely. The open book trains that rotation lying down, with the hips held still so the movement comes from the upper back.
  body_regions:
    - back
    - shoulders
  primary_targets:
    - thoracic spine (rotation mobility)
  secondary_targets:
    - chest
    - front of the shoulder
  physique_targets: []
  functional_goals:
    - upper-body-mobility
  movement_patterns:
    - mobility drill
    - side-lying upper-back rotation
  equipment:
    - bodyweight
  exercise_type: compound
  laterality: unilateral
  coverage_categories:
    - low-setup
    - low-fatigue
    - equipment-limited-substitute
  training_mode: mobility-dynamic
  when:
    - warm_up
  resistance_profile: Bodyweight; range is limited by upper-back rotation, not by load.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 0
    seconds_per_set: 35
    rest_seconds: [15, 45]
    per_side: true
    superset_friendly: true
  best_used_when:
    - Upper-back rotation for overhead strokes is wanted, as part of a warm-up or a mobility session.
  less_suitable_when:
    - Lying on the side is uncomfortable for the shoulder underneath; thread the needle trains similar rotation on hands and knees.
  mirror_effect: Not a physique exercise; it builds upper-back rotation.
  advantages: []
  limitations:
    - If the knees drift apart, the lower back twists instead of the upper back, so the hips need to stay stacked.
    - It trains range, not strength, at the end of the rotation.
  technique_cues:
    - Lie on one side with the hips and knees bent to about 90 degrees and the arms straight out in front, palms together.
    - Keep the knees pressed together, or hold them down with the bottom hand.
    - Open the top arm up and across, following the hand with the eyes, until the chest faces the ceiling as far as is comfortable.
    - Breathe out at the end of the range, then return slowly and repeat.
  common_mistakes:
    - 'Knees lifting or sliding apart: the rotation moves to the lower back.'
    - 'Forcing the arm to the floor: the shoulder gets stretched instead of the upper back rotating.'
    - 'Rushing the reps: the drill works by easing a little further each time.'
  programming_notes:
    - Do both sides; if one side is clearly stiffer, give it a few extra reps.
  alternatives: []
  complements:
    - Thread the needle, which trains the same rotation from hands and knees.
  overlaps_with:
    - thread-the-needle
  evidence_notes: []
  review_status: reviewed
  video_link: https://www.youtube.com/watch?v=peeW19ofFUg
  video_creator: Elite Performance Institute
  video_title: Thoracic Rotation Open Book
  video_status: verified
  video_verified_on: "2026-10-26"
  video_verification_method: metadata

- id: thread-the-needle
  name: Thread the Needle
  summary: From hands and knees, reaching one arm under the body and then up toward the ceiling, rotating the upper back each way.
  why_this_exists: It trains upper-back rotation in both directions from a stable position on hands and knees, useful for the twisting involved in overhead and backhand strokes.
  body_regions:
    - back
    - shoulders
  primary_targets:
    - thoracic spine (rotation mobility)
  secondary_targets:
    - rear shoulder
    - upper back muscles
  physique_targets: []
  functional_goals:
    - upper-body-mobility
  movement_patterns:
    - mobility drill
    - quadruped upper-back rotation
  equipment:
    - bodyweight
  exercise_type: compound
  laterality: unilateral
  coverage_categories:
    - low-setup
    - low-fatigue
    - equipment-limited-substitute
  training_mode: mobility-dynamic
  when:
    - warm_up
  resistance_profile: Bodyweight; range is limited by upper-back rotation.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 0
    seconds_per_set: 35
    rest_seconds: [15, 45]
    per_side: true
    superset_friendly: true
  best_used_when:
    - Upper-back rotation is wanted as a warm-up or between sets, with no equipment.
  less_suitable_when:
    - Kneeling or weight on one hand is uncomfortable; the open book trains similar rotation lying on the side.
  mirror_effect: Not a physique exercise; it builds upper-back rotation.
  advantages: []
  limitations:
    - The hips tend to shift sideways to fake extra range, so it needs a deliberate, slow tempo.
    - Kneeling on a hard floor can be uncomfortable without a mat.
  technique_cues:
    - Start on hands and knees with the hands under the shoulders and the knees under the hips.
    - Slide one arm under the body, palm up, letting the shoulder and side of the head lower toward the floor.
    - Reverse the movement and reach the same arm up toward the ceiling, following the hand with the eyes.
    - Keep the hips level over the knees throughout.
  common_mistakes:
    - 'Hips swaying sideways: the movement comes from the hips instead of the upper back.'
    - 'Collapsing onto the supporting arm: the shoulder sags and the rotation shrinks.'
    - 'Bouncing at the end of the range: controlled reps work better than momentum.'
  programming_notes:
    - A pause of a breath or two at the bottom turns it into a gentle held stretch.
  alternatives: []
  complements:
    - The thoracic open book for the same rotation lying down.
  overlaps_with:
