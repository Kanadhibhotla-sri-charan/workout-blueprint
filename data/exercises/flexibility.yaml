- id: band-shoulder-pass-through
  name: Band Shoulder Pass-Through
  summary: Holding a band with a wide grip and taking straight arms overhead and behind the back, then returning, to move the shoulders through their full range.
  why_this_exists: Overhead strokes need the shoulders to move freely through a big arc. Pass-throughs take both shoulders through that arc under light tension.
  body_regions:
    - shoulders
    - chest
  primary_targets:
    - shoulders (flexion and extension mobility)
  secondary_targets:
    - chest
    - upper back muscles
  physique_targets: []
  functional_goals:
    - upper-body-mobility
  movement_patterns:
    - mobility drill
    - straight-arm overhead arc
  equipment:
    - band
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - low-setup
    - low-fatigue
    - equipment-limited-substitute
  training_mode: mobility-dynamic
  when:
    - warm_up
  resistance_profile: Light band tension; a wider grip makes it easier, a narrower grip harder.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 1
    seconds_per_set: 50
    rest_seconds: [15, 45]
    per_side: false
    superset_friendly: true
  best_used_when:
    - A shoulder warm-up is wanted before overhead training or court sessions.
  less_suitable_when:
    - The shoulders are injured or unstable; a narrow grip or forced range can strain them.
  mirror_effect: Not a physique exercise; it builds overhead shoulder range.
  advantages: []
  limitations:
    - A grip that is too narrow forces the shoulders past their range, so the grip needs to be wide enough for smooth reps.
    - A stick or broomstick works similarly but has no give.
  technique_cues:
    - Stand tall and hold a light band in front of the thighs with a wide grip and straight arms.
    - Keep the ribs down and lift the band overhead in a slow arc.
    - Continue behind the body as far as is comfortable, keeping the elbows straight.
    - Return the same way to the front, and widen the grip if any rep feels forced.
  common_mistakes:
    - 'Bending the elbows to get the band over: the shoulders are no longer moving through range.'
    - Arching the lower back to get the arms back.
    - Gripping too narrowly and forcing the reps.
  programming_notes:
    - Narrow the grip gradually over weeks as range improves, never within a set.
  alternatives: []
  complements:
    - The doorway pec stretch after training.
