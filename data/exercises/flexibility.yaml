    - low-setup
    - low-fatigue
    - equipment-limited-substitute
  training_mode: mobility-hold
  when:
    - post_session
    - rest_day
  resistance_profile: Bodyweight; how far the body steps through the frame sets the depth.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  time:
    setup_minutes: 0
    seconds_per_set: 40
    rest_seconds: [15, 30]
    per_side: true
    superset_friendly: true
  best_used_when:
    - Chest and front-shoulder tightness is the issue, after training or on rest days.
  less_suitable_when:
    - The front of the shoulder feels pinched or unstable in this position; lower the arm or skip it.
  mirror_effect: Not a physique exercise; it builds chest and front-shoulder range.
  advantages: []
  limitations:
    - Elbow height changes which part of the chest is stretched, so the position needs a little experimenting.
    - Stepping too far through can stress the front of the shoulder joint rather than stretch the muscle.
  technique_cues:
    - Stand in a doorway and place one forearm on the frame with the elbow at about shoulder height and bent to 90 degrees.
    - Step the same-side foot forward through the doorway.
    - Turn the chest gently away from the arm until a stretch is felt across the chest.
    - Keep the shoulder down and back, away from the ear, and breathe slowly.
  common_mistakes:
    - 'Shrugging the shoulder up: the stretch moves into the neck and the joint is less protected.'
    - Leaning in hard enough to feel it at the front of the joint rather than the chest muscle.
    - Arching the lower back to get further through the frame.
  programming_notes:
    - Try the elbow slightly below and slightly above shoulder height to stretch different parts of the chest.
  alternatives: []
  complements:
    - Band shoulder pass-throughs to move the shoulder through range afterwards.
