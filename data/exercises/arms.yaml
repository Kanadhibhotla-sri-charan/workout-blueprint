    - The heaviest, most mechanical-tension-driven triceps stimulus
      available is the goal, with chest and shoulder work coming along as
      a secondary benefit.
  less_suitable_when:
    - The elbows or wrists dislike the narrow grip, or the routine already
      has substantial pressing volume competing for the same recovery.
  mirror_effect: ""
  advantages: []
  limitations:
    - The narrow grip places real stress on the wrists and elbows, and some
      lifters simply can't tolerate it even with otherwise good bench-press
      technique.
    - A spotter or safety bars are genuinely needed to train close to failure
      safely, same as a regular-grip bench press.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - An overhead triceps extension, which loads a position pressing does
      not.
  overlaps_with:
    - dip-triceps-biased
  evidence_notes:
    - >-
      The "lateral- and medial-head-biased" claim carried by this record
      (and by dip-triceps-biased, cable-pushdown, machine-triceps-
      extension, and triceps-kickback below) is corrected here: it isn't
      supported by the same kind of evidence as the long-head claim. The
      long head crosses the shoulder joint, so its length — and therefore
      its bias — changes with shoulder position, which is what Maeo et al.
      (2023, see overhead-triceps-extension) actually measured. The
      lateral and medial heads only cross the elbow, so shoulder position
      does not change their length the same way, and no equivalent study
      was found showing these two heads are differentially biased by
      grip, shoulder-extension, or non-overhead elbow-extension movements
      specifically. The safest claim these movements support is that they
      train the triceps as a whole, with the long head under less stretch
      than an overhead position provides — not a specific lateral/medial
      split.
  review_status: reviewed

- id: overhead-triceps-extension
  name: Overhead Triceps Extension
  summary: >-
    Trains elbow extension with the shoulder flexed, commonly cited as
    the strongest stretch-mediated stimulus for the triceps long head.
  why_this_exists: >-
    Trains elbow extension with the shoulder flexed, a position that
    pressing movements do not load.
  body_regions: [arms]
  primary_targets: [triceps (long-head-biased, strongly supported by hypertrophy research)]
  secondary_targets: []
  movement_patterns: [elbow extension, shoulder flexed (overhead)]
  equipment: [barbell, ez-bar, dumbbell]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, lengthened-position-emphasis]
  resistance_profile: >-
    Free-weight profile; barbell or EZ-bar allows the heaviest load on a
    fixed path, dumbbells allow independent arms.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - Triceps work has all been pressing and pushdowns, and what's missing
      is the long head's strongest stretch-mediated growth stimulus.
  less_suitable_when:
    - The overhead position is uncomfortable, capping how much of that
      stretch can actually be loaded.
  mirror_effect: ""
  advantages: []
  limitations:
    - The overhead shoulder position demands real mobility, and lifters without
      it either can't reach the position safely or lose meaningful range
      trying.
    - Elbow stress at the bottom of the stretch is real, and load has to be
      added conservatively compared to a pushdown or a compound press.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A pressing movement or a pushdown.
  overlaps_with:
    - cable-overhead-extension-leaning-forward
    - lying-triceps-extension-skull-crusher
  evidence_notes:
    - >-
      Strong evidence, and stronger than the biceps head-bias claims above:
      Maeo et al. (2023, European Journal of Sport Science) used MRI to
      measure triceps long-head growth after 12 weeks of overhead extension
      training vs. a non-overhead (arm-at-side) extension, at matched
      volume. The overhead group gained roughly 28.5% long-head cross-
      sectional area at the site closest to the shoulder vs. roughly 19.6%
      for the non-overhead group, with the gap most pronounced proximally,
      consistent with the long head being stretched at the shoulder in the
      overhead position. This is direct MRI-measured hypertrophy data, not
      just EMG, which is why this claim is stated more confidently than the
      biceps incline/preacher claims. It only establishes the long head's
      bias, not any lateral- or medial-head effect — see the notes on
      close-grip-bench-press, dip-triceps-biased, cable-pushdown,
      machine-triceps-extension, and triceps-kickback below for why those
      heads' bias claims are treated differently.
    - >-
      This record's "strongest stretch-mediated growth stimulus" framing
      is also consistent with the broader stretch-mediated hypertrophy
      literature — see incline-dumbbell-curl's evidence_notes above for
      the general citations (Schoenfeld & Grgic, 2020; Wolf et al., 2023,
      2025). The Maeo et al. (2023) finding above is the stronger,
      exercise-specific evidence; this is additional general-principle
      grounding, not a separate direct finding.
  review_status: reviewed

