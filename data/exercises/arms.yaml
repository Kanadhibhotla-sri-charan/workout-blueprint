# Canonical exercise records for the arms module.
# Format decided in docs/adr/0001-canonical-record-format.md.
# Schema: docs/knowledge-manual/FOUNDATION.md, "Canonical Exercise Record."
# Converted from docs/knowledge-manual/arms/ARMS.md.
#
# Evidence-notes pass (partial): the biceps incline/preacher long-vs-
# short-head claims and the triceps overhead-vs-neutral long-head claim
# now carry real citations in evidence_notes — see each record. The drag
# curl / cable drag curl "short-head-biased" claim was corrected: the
# elbows-behind-body position extends the shoulder, the same direction
# incline curls use for their long-head bias, so the common "short head"
# cue for drag curls actually contradicts the biomechanical logic the
# incline-curl evidence supports. No direct research on drag curls was
# found to resolve it either way — flagged as contested, not asserted.
# Claims without an evidence_notes entry below are still unresolved
# coaching cues per ADR 0001's no-fabrication policy.

- id: barbell-ez-bar-curl
  name: Barbell or EZ-Bar Curl
  summary: >-
    The most straightforward loadable curl, the primary mechanical-
    tension, strength-building biceps movement.
  why_this_exists: >-
    The most straightforward loadable curl, with small load steps and an
    easy progression path.
  body_regions: [arms]
  primary_targets: [biceps (both heads, roughly even at a neutral shoulder position)]
  secondary_targets: [brachialis, forearms]
  movement_patterns: [elbow flexion]
  equipment: [barbell, ez-bar]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-setup]
  resistance_profile: >-
    Free-weight profile, fixed bar path.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - The primary mechanical-tension, strength-building curl is wanted, to
      progress load on over time.
  less_suitable_when:
    - A straight bar irritates the wrists — an EZ bar or dumbbells deliver
      the same stimulus without that cost.
  mirror_effect: ""
  advantages: []
  limitations:
    - The fixed bar path doesn't let the wrists find their own natural rotation
      through the rep, which is part of why a straight bar in particular
      bothers some lifters' wrists and elbows.
    - Momentum from the shoulders and lower back is an easy substitute for
      elbow-flexor tension once the load gets heavy, and it's not always
      obvious from the outside that this has happened.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A curl with a different arm position, or a neutral-grip curl.
  overlaps_with:
    - dumbbell-curl
    - cable-curl
  evidence_notes: []
  review_status: reviewed

