    lowers like a reverse curl — one movement for biceps and forearm.
  why_this_exists: >-
    Curls up with a supinated grip like a standard curl, then rotates to a
    pronated grip at the top and lowers like a reverse curl, so one
    movement trains the biceps on the way up and the forearm extensors
    and brachioradialis on the way down.
  body_regions: [arms]
  primary_targets: [biceps (concentric half)]
  secondary_targets: [brachioradialis, wrist extensors (eccentric half)]
  movement_patterns: [elbow flexion, grip rotation from supinated to pronated]
  equipment: [dumbbell]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-setup]
  resistance_profile: >-
    Free-weight profile with a mid-rep grip rotation.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A combined biceps-and-forearm growth stimulus is wanted in one
      movement, with the slow eccentric half adding real tension the
      concentric-only lift of a standard curl skips.
  less_suitable_when:
    - The rotation at the top breaks down under heavier load, capping how
      much weight can be used for either half of the stimulus.
  mirror_effect: ""
  advantages: []
  limitations:
    - The grip rotation at the top is a coordination demand that breaks down
      under heavier load, which caps how much weight can be used for either
      half of the movement.
    - Because load is limited by the rotation, neither the concentric biceps
      stimulus nor the eccentric forearm stimulus reaches the intensity a
      dedicated single-purpose exercise could deliver.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
