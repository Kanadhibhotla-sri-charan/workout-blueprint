- id: drag-curl
  name: Drag Curl
  summary: >-
    Dragging the bar up along the torso lets the elbows travel behind
    the body for a stricter, more isolated biceps stimulus.
  why_this_exists: >-
    Dragging the bar up along the torso lets the elbows travel behind the
    body instead of staying pinned forward, which removes front-delt
    involvement and changes the biceps' loading path.
  body_regions: [arms]
  primary_targets: [biceps (head bias contested — see evidence_notes)]
  secondary_targets: []
  movement_patterns: [elbow flexion, elbows drawn behind the torso]
  equipment: [barbell, ez-bar]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation]
  resistance_profile: >-
    Free-weight profile, elbows-behind-body path.
  stability_demand: low
  skill_demand: medium
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A stricter, more isolated biceps stimulus is wanted that removes the
      shoulder swing a standard curl can lean on.
  less_suitable_when:
    - Shoulder mobility doesn't allow the elbows to travel back
      comfortably, limiting how strict the path can actually be kept.
  mirror_effect: ""
  advantages: []
  limitations:
    - Shoulder mobility genuinely limits how far back the elbows can travel,
      and forcing the position without that mobility defeats the strict path
      that's the point of the exercise.
    - It's a less intuitive movement pattern than a standard curl, and it takes
      real practice to keep the bar dragging along the torso rather than
      swinging forward.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A standard barbell or dumbbell curl.
  overlaps_with:
    - barbell-ez-bar-curl
    - cable-drag-curl
  evidence_notes:
    - >-
      The common coaching cue calls this short-head-biased, but that
      contradicts the biomechanical principle the incline-curl evidence
      supports: drawing the elbows behind the torso extends the
      shoulder, the same direction incline curls use, which the EMG
      evidence ties to a long-head bias, not short. No study specifically
      testing drag curls was found to resolve the contradiction. Treat
      the head-bias claim as unresolved rather than asserting either
      side; the movement's real, better-supported value is the stricter,
      swing-free path (see why_this_exists), not a specific head bias.
  review_status: reviewed

