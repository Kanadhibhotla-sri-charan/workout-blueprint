- id: incline-dumbbell-curl
  name: Incline Dumbbell Curl
  summary: >-
    Places the upper arm behind the body for the strongest available
    stretch-mediated biceps growth stimulus.
  why_this_exists: >-
    Places the upper arm behind the body, so the load stays meaningful
    with the elbow near full extension.
  body_regions: [arms]
  primary_targets: [biceps (long-head-biased, EMG-supported)]
  secondary_targets: []
  movement_patterns: [elbow flexion, lengthened shoulder position]
  equipment: [dumbbell, incline bench]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, lengthened-position-emphasis]
  resistance_profile: >-
    Free-weight profile, hardest with the arm long, extended shoulder
    position.
  stability_demand: low
  skill_demand: medium
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - A strong stretch-mediated growth stimulus is wanted, which the
      extended shoulder position delivers in a way a standing curl cannot
      replicate.
  less_suitable_when:
    - The shoulder position is uncomfortable, capping how much of that
      stretch can actually be used under load.
  mirror_effect: ""
  advantages: []
  limitations:
    - The extended shoulder position is genuinely uncomfortable for some
      lifters, which caps how much of the intended stretch can actually be
      loaded.
    - Load ceiling is modest compared to a standing curl, since the stretched
      shoulder position is the limiting factor rather than raw biceps strength.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A shortened-position curl such as a preacher curl.
  overlaps_with: []
  evidence_notes:
    - >-
      EMG evidence supports a long-head bias in the shoulder-extended
      position: incline curls maintain higher, more sustained biceps
      brachii activation through the range than shoulder-flexed variants
      (Lehman, 2005-era EMG shoulder-position studies). The clearest
      direct hypertrophy evidence for this shoulder-position effect is
      Kassiano et al. (2024, PMC11906226), which compared a shoulder-
      flexed (preacher) vs. shoulder-extended (Bayesian cable curl)
      position for regional hypertrophy. Evidence quality: moderate —
      real EMG and one hypertrophy trial, not yet a large body of
      literature.
    - >-
      Separate from the shoulder-position/long-head evidence above, this
      record's "strongest stretch-mediated stimulus" framing also draws
      on the broader stretch-mediated hypertrophy literature: Schoenfeld
      & Grgic (2020, SAGE Open Medicine) found full/longer-ROM training
      tends to match or beat partial-ROM training that avoids the
      stretch, and Wolf et al. (2023, International Journal of Strength
      and Conditioning) found lengthened partial-ROM training matched or
      exceeded full-ROM training, with both beating shortened-position
      training. A later trial (Wolf et al., 2025, PubMed 39959841) found
      lengthened partials produced hypertrophy similar to, not clearly
      greater than, full ROM in trained lifters — so "strongest" should
      be read as a well-supported direction, not a settled magnitude.
      This is a general training-science principle, not a finding from a
      study that used this specific exercise.
  review_status: reviewed

- id: preacher-curl
  name: Preacher Curl
  summary: >-
    Fixes the upper arm forward on a pad, removing swing for a strict,
    shortened-position biceps stimulus.
  why_this_exists: >-
    Fixes the upper arm forward on a pad, which removes swing and keeps
    tension nearer the top of the range.
  body_regions: [arms]
  primary_targets: [biceps (short-head-biased, EMG-supported)]
  secondary_targets: [brachialis]
  movement_patterns: [elbow flexion, shortened shoulder position]
  equipment: [barbell, ez-bar, dumbbell, preacher bench]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, shortened-position-emphasis]
  resistance_profile: >-
    Free-weight profile; barbell, EZ-bar, or dumbbells all work on the
    same bench — a grip and independent-arm preference, not a different
    movement.
  stability_demand: low
  skill_demand: low
  setup_time: medium
  fatigue_cost: low
  best_used_when:
    - A strict, swing-free mechanical-tension stimulus is wanted late in a
      session, when standing curls would start to rely on momentum.
  less_suitable_when:
    - The bottom of the range feels uncomfortable under load, which can
      limit how much of the strict range actually gets used.
  mirror_effect: ""
  advantages: []
  limitations:
    - The bottom of the range can feel uncomfortable at the elbow for some
      lifters, especially near full extension under load, which can limit how
      much of the strict range gets used.
    - Requires a preacher bench, which isn't available in every gym or home
      setup the way a standing curl is.
  technique_cues: []
  common_mistakes: []
  programming_notes: >-
    EMG shows preacher curls produce a short, bottom-loaded activation
    window (high activation early in the concentric phase, dropping off
    as the elbow flexes) compared to the sustained activation of an
    incline curl through the whole range — consistent with, though not
    conclusive proof of, a short-head bias.
  alternatives: []
  complements:
    - A lengthened-position curl such as an incline curl.
  overlaps_with:
    - preacher-curl-machine
  evidence_notes:
    - >-
      Same shoulder-position evidence as the incline curl's long-head
      claim, applied in reverse: shoulder flexion (preacher) vs. shoulder
      extension (incline) is the mechanism cited. Kassiano et al. (2024,
      PMC11906226) is the closest direct hypertrophy comparison. Evidence
      quality: moderate.
  review_status: reviewed

