- id: flat-barbell-bench-press
  name: Flat Barbell Bench Press
  summary: >-
    The reference horizontal chest press and the primary mechanical-
    tension, strength-building mid-chest stimulus.
  why_this_exists: >-
    The reference horizontal chest press, loadable with small increments
    and the most common way to build and track chest pressing strength.
  body_regions: [chest]
  primary_targets:
    - chest (commonly cited as mid/sternal-biased)
  secondary_targets: [anterior deltoids, triceps]
  movement_patterns: [horizontal press]
  equipment: [barbell, bench, rack]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound]
  resistance_profile: >-
    Free-weight profile, hardest off the chest, easiest at lockout.
  stability_demand: medium
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - The primary mechanical-tension and strength-building stimulus for
      the mid chest is the goal — this is the movement most routines build
      their pressing progression around, and the one where absolute load
      climbs fastest over time.
  less_suitable_when:
    - The routine already has a heavy pressing movement covering mechanical
      tension, and what's actually missing is a pump-oriented finisher or a
      stretch-biased stimulus this movement does not provide.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - A fly variation or an incline press selected for a distinct role.
  overlaps_with:
    - flat-dumbbell-press
    - machine-chest-press
    - cable-chest-press
    - smith-machine-bench-press
  evidence_notes:
    - >-
      Weaker claim to make than it sounds, and supported more
      circumstantially than the upper-chest claim: the sternocostal
      (mid/lower-most) head is simply the largest portion of the
      pectoralis major and the one every horizontal press loads by
      default, rather than a bias any specific technique creates. EMG
      support: Rodríguez-Ridao et al. (2020, PMC7579505) found the
      sternocostal head was more active at 0° (flat) than at incline
      angles. Hypertrophy support: in Chaves et al. (2020, PMC7449336),
      mid-chest growth was statistically similar across the flat, incline,
      and combined groups — consistent with flat pressing doing at least
      as well here as any other angle, though it doesn't isolate a flat-
      specific advantage the way the incline data isolates one for the
      upper chest.
  review_status: draft

