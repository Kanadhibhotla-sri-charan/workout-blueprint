# Canonical exercise records for the chest module.
# Format decided in docs/adr/0001-canonical-record-format.md.
# Schema: docs/knowledge-manual/FOUNDATION.md, "Canonical Exercise Record."
# Converted from docs/knowledge-manual/chest/CHEST.md.
#
# Fields with no source material in the prose (mirror_effect, advantages,
# limitations, technique_cues, common_mistakes, programming_notes,
# alternatives, evidence_notes) are left empty rather than fabricated.
#
# Evidence-notes pass (partial): the upper/clavicular-biased claim carried
# by the incline family now has strong, direct support (an MRI hypertrophy
# trial plus EMG), the mid/sternal-biased claim carried by the flat family
# has real but more circumstantial support, and the lower/costal-biased
# claim carried by the dip and decline fly has EMG support only — no
# hypertrophy trial isolating that region was found. The cable fly's
# pulley-height bias claim and the pullover's general/costal claim remain
# unresolved coaching cues per ADR 0001's no-fabrication policy — flagged,
# not asserted.

- id: incline-dumbbell-press
  name: Incline Dumbbell Press
  summary: >-
    A freely moving incline press for an upper-chest-biased mechanical-
    tension and stretch stimulus, using independent dumbbells.
  why_this_exists: >-
    A freely moving incline press for users who want an incline-oriented
    chest press and can control independent dumbbells.
  body_regions: [chest]
  primary_targets:
    - chest (commonly cited as upper/clavicular-biased)
  secondary_targets: [anterior deltoids, triceps]
  movement_patterns: [incline horizontal press]
  equipment: [dumbbell, bench]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [heavy-compound, lengthened-position-emphasis]
  resistance_profile: >-
    Free-weight profile, hardest through the middle of the range; independent
    arms allow a deeper bottom-range stretch than a fixed bar, at the cost of
    a lower absolute load ceiling than a barbell press.
  stability_demand: high
  skill_demand: medium
  setup_time: medium
  fatigue_cost: medium
  best_used_when:
    - A strong mechanical-tension stimulus for the upper chest is the goal.
    - A deeper bottom-range stretch than a barbell allows is wanted, since
      each arm can drop past where a fixed bar would stop.
  less_suitable_when:
    - The stability demand of controlling two independent dumbbells caps how
      much weight can be used, limiting the mechanical-tension ceiling for a
      stronger lifter.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - cable-fly
    - A stable machine press, depending on the rest of the routine.
  overlaps_with:
    - incline-barbell-press
    - incline-machine-press
    - smith-machine-incline-press
    - incline-cable-press
  evidence_notes:
    - >-
      Strong evidence, among the best-supported region-bias claims in this
      dataset. Chaves et al. (2020, International Journal of Exercise
      Science, PMC7449336) trained untrained men on flat, 44-degree
      incline, or a combination of both for 8 weeks and measured pec
      thickness by ultrasound/MRI-style imaging: the incline group gained
      upper-chest thickness far beyond the flat group (a very large,
      outlier-sized effect — over 60% relative increase), while mid-chest
      growth was similar across groups. This is direct regional-
      hypertrophy data, not just EMG. It's backed by EMG evidence too:
      Rodríguez-Ridao et al. (2020, PMC7579505) found clavicular-head
      activation rose with incline angle across five bench inclinations.
      Evidence quality: strong — a real hypertrophy trial plus consistent
      EMG, though still a single hypertrophy trial with an unusually large
      effect size that hasn't yet been replicated.
  review_status: draft

