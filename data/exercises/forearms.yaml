- id: reverse-curl
  name: Reverse Curl
  summary: Loads the brachioradialis and forearm extensors through an elbow- flexion pattern, adding arm and forearm work at once.
  why_this_exists: Loads the brachioradialis and forearm extensors through an elbow-flexion pattern, so it adds arm and forearm work at once.
  body_regions:
    - forearms
  primary_targets:
    - brachioradialis
    - wrist extensors
  secondary_targets:
    - biceps
    - brachialis
  physique_targets:
    - forearm-extensors
  movement_patterns:
    - elbow flexion
    - pronated grip
  equipment:
    - barbell
    - ez-bar
    - dumbbell
    - band
  equipment_setups:
    - [barbell]
    - [ez-bar]
    - [dumbbell]
    - [band]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-setup
  resistance_profile: Barbell or EZ-bar allows the heaviest load on a fixed path; dumbbells allow independent arms and let each wrist find its own comfortable angle. A band stood on gets heavier toward the top of the curl.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A forearm-thickness stimulus is wanted that also counts toward elbow-flexion volume, getting two growth roles from one movement.
  less_suitable_when:
    - Wrist comfort is limiting with a straight bar — an EZ bar delivers the same stimulus without that cost.
  mirror_effect: Tends to show up as width right at the elbow crease on the thumb side of the forearm — the brachioradialis is what creates that forearm "peak" when the elbow is bent, and this is a direct way to build it.
  advantages: []
  limitations:
    - Usable load is capped well below a standard supinated curl's, since the pronated grip is a mechanically weaker position for elbow flexion.
    - Wrist discomfort with a straight bar is common at this grip angle, which is part of why an EZ-bar or dumbbell version often has to substitute in for it.
  technique_cues:
    - Hold the bar or dumbbells with an overhand grip, palms down, hands about shoulder width.
    - Keep the wrists straight, in line with the forearms; don't let them bend back.
    - Curl with the elbows fixed at your sides, then lower all the way down.
    - Switch to an EZ-bar or dumbbells if a straight bar bothers your wrists.
  common_mistakes:
    - "Wrists bending back under the load: stresses the wrist and takes tension off the forearm muscles."
    - "Loading it like a regular curl: the overhand grip is weaker, so too much weight turns into swinging."
    - "Elbows drifting forward: the shoulders help lift the weight."
  programming_notes:
    - "Band version: stand on the middle of a band and curl the ends with an overhand grip, elbows pinned at the sides. A wider stance adds resistance."
  alternatives: []
  complements:
    - A supinated curl and direct wrist work.
  overlaps_with:
    - hammer-curl (arms module)
    - reverse-wrist-curl
    - cable-reverse-curl
    - zottman-curl (arms module)
  evidence_notes: []
  review_status: reviewed
