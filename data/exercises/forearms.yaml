# Canonical exercise records for the forearms module.
# Format decided in docs/adr/0001-canonical-record-format.md.
# Schema: docs/knowledge-manual/FOUNDATION.md, "Canonical Exercise Record."
# Converted from docs/knowledge-manual/forearms/FOREARMS.md.
#
# Note: farmers-carry and pronation-supination-work are primarily
# function-and-grip-strength tools, not hypertrophy drivers — see their
# best_used_when fields, which say so explicitly rather than forcing a
# growth-stimulus framing that doesn't fit.

- id: wrist-curl
  name: Wrist Curl
  summary: >-
    Direct loading for the wrist flexors, which larger lifts train only
    indirectly through gripping.
  why_this_exists: >-
    Direct loading for the wrist flexors, which larger lifts train only
    indirectly through gripping.
  body_regions: [forearms]
  primary_targets: [wrist flexors]
  secondary_targets: []
  movement_patterns: [wrist flexion]
  equipment: [barbell, dumbbell, cable]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-setup, low-fatigue]
  resistance_profile: >-
    Barbell allows the heaviest fixed-path load; dumbbells let each wrist
    move independently; a cable keeps tension through the whole range at
    the cost of a less natural wrist path.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A direct mechanical-tension stimulus for forearm size is wanted, or
      wrist strength that doesn't depend on grip endurance running out
      first.
  less_suitable_when:
    - The wrists are already loaded by heavy pressing and pulling in the
      same session, adding fatigue without much additional growth
      stimulus.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Wrist extension work, which balances the other side of the forearm.
  overlaps_with:
    - reverse-wrist-curl
  evidence_notes: []
  review_status: draft

- id: reverse-wrist-curl
  name: Reverse Wrist Curl
  summary: >-
    Trains the wrist extensors, which little else in a normal routine
    loads directly.
  why_this_exists: >-
    Trains the wrist extensors, which little else in a normal routine
    loads directly.
  body_regions: [forearms]
  primary_targets: [wrist extensors]
  secondary_targets: []
  movement_patterns: [wrist extension]
  equipment: [barbell, dumbbell, cable]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories: [isolation, low-setup, low-fatigue]
  resistance_profile: >-
    Barbell, dumbbells, or a cable all work the same way a wrist curl's
    equipment choice does.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
