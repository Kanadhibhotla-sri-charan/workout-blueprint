- id: reverse-wrist-curl
  name: Reverse Wrist Curl
  summary: Trains the wrist extensors, which little else in a normal routine loads directly.
  why_this_exists: Trains the wrist extensors, which little else in a normal routine loads directly.
  body_regions:
    - forearms
  primary_targets:
    - wrist extensors
  secondary_targets: []
  physique_targets:
    - forearm-extensors
  movement_patterns:
    - wrist extension
  equipment:
    - barbell
    - dumbbell
    - cable
    - band
  equipment_setups:
    - [barbell]
    - [dumbbell]
    - [cable]
    - [band]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-setup
    - low-fatigue
  resistance_profile: Barbell, dumbbells, or a cable all work the same way a wrist curl's equipment choice does. A band anchored under the foot is lightest at the bottom and heaviest as the wrist extends.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Plenty of gripping work exists and nothing trains the back of the forearm — this fills a growth and balance gap most routines leave open.
  less_suitable_when:
    - Elbow-region symptoms are present — pain is a stop-and-assess signal, not something to load through.
  mirror_effect: Tends to show up as fullness on the back-of-hand side of the forearm, which is the side that's actually visible when the arm hangs relaxed at the side — this fills out the top of the forearm rather than the palm-facing side a wrist curl builds.
  advantages: []
  limitations:
    - The wrist extensors are considerably weaker than the flexors, so usable load is low even for a lifter who is otherwise strong — the exercise can feel trivial in weight compared to everything else in a session.
    - This is a common site for elbow-tendon irritation (a lateral-elbow, "tennis elbow"-type strain) if volume or load increases too quickly.
  technique_cues:
    - Sit with your forearms on your thighs or a bench, palms down and wrists just past the edge.
    - Let the hands lower slowly, then raise the backs of the hands as high as they go.
    - Move only at the wrist; keep the forearms flat on the support.
  common_mistakes:
    - "Using too much weight: the forearms or elbows lift to help and the wrist extensors do little."
    - "Raising load or volume quickly: a common route to irritation on the outside of the elbow (tennis-elbow type)."
    - "Bouncing at the bottom: momentum replaces the controlled lowering."
  programming_notes:
    - "Band version: sit with the forearm on the thigh, palm down, and the band anchored under the foot. Shorten the band to add resistance."
  alternatives: []
  complements:
    - Wrist curls and grip work.
  overlaps_with:
    - reverse-curl
  evidence_notes: []
