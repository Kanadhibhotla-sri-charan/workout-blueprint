- id: farmers-carry
  name: Farmer's Carry
  summary: >-
    Trains grip under load for time, matching how grip actually limits
    rows, pulldowns, and hinges — a function-and-endurance tool, not
    primarily a hypertrophy driver.
  why_this_exists: >-
    Trains grip under load for time, which matches how grip actually
    limits rows, pulldowns, and hinges.
  body_regions: [forearms]
  primary_targets: [grip, forearms]
  secondary_targets: [traps, trunk musculature]
  movement_patterns: [loaded carry]
  equipment: [dumbbell, farmer's handles]
  exercise_type: compound
  laterality: bilateral
  coverage_categories: [skill-coordination]
  resistance_profile: >-
    Free-weight, whole-body fatigue cost.
  stability_demand: medium
  skill_demand: low
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - Grip is what actually ends a set before the target muscle on pulling
      work does — this builds the strength-and-endurance capacity to
      remove that limiter, more than it's meant as a hypertrophy tool in
      its own right.
  less_suitable_when:
    - The systemic fatigue this movement produces isn't worth the cost
      late in a hard session, when a lighter, more isolated forearm
      movement would deliver a similar training effect for less overall
      cost.
  mirror_effect: ""
  advantages: []
  limitations: []
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Pulling work and static holds.
  overlaps_with:
    - "barbell-dumbbell-shrug (back module)"
  evidence_notes: []
  review_status: draft

