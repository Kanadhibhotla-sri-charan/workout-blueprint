- id: farmers-carry
  name: Farmer's Carry
  summary: Trains grip under load for time, matching how grip actually limits rows, pulldowns, and hinges — a function-and-endurance tool, not primarily a hypertrophy driver.
  why_this_exists: Trains grip under load for time, which matches how grip actually limits rows, pulldowns, and hinges.
  body_regions:
    - forearms
  primary_targets:
    - grip
    - forearms
  secondary_targets:
    - traps
    - trunk musculature
  movement_patterns:
    - loaded carry
  equipment:
    - dumbbell
    - farmer's handles
  equipment_setups:
    - [dumbbell]
    - ["farmer's handles"]
  exercise_type: compound
  laterality: bilateral
  coverage_categories:
    - skill-coordination
  resistance_profile: Free-weight, whole-body fatigue cost.
  stability_demand: medium
  skill_demand: low
  setup_time: low
  fatigue_cost: high
  best_used_when:
    - Grip is what actually ends a set before the target muscle on pulling work does — this builds the strength-and-endurance capacity to remove that limiter, more than it's meant as a hypertrophy tool in its own right.
  less_suitable_when:
    - The systemic fatigue this movement produces isn't worth the cost late in a hard session, when a lighter, more isolated forearm movement would deliver a similar training effect for less overall cost.
  mirror_effect: Contributes to general forearm and grip girth over time from repeated heavy time-under-tension, but it isn't a shaping tool — any visible effect is closer to overall forearm size and vein prominence from the endurance demand than a specific outline change.
  advantages: []
  limitations:
    - The whole-body fatigue cost is disproportionate to the forearm-specific stimulus it delivers, so it's an inefficient choice when forearm growth alone is the goal.
    - Grip and traps usually fatigue well before the rest of the body does, so it doesn't double as meaningful leg or cardiovascular conditioning despite the systemic fatigue it produces.
    - Space and equipment requirements (a clear walking lane, loaded handles or dumbbells) make it harder to fit into a typical gym session than most forearm work.
  technique_cues: []
  common_mistakes: []
  programming_notes: []
  alternatives: []
  complements:
    - Pulling work and static holds.
  overlaps_with:
    - barbell-dumbbell-shrug (back module)
