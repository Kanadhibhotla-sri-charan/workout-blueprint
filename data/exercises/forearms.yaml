- id: wrist-curl
  name: Wrist Curl
  summary: Direct loading for the wrist flexors, which larger lifts train only indirectly through gripping.
  why_this_exists: Direct loading for the wrist flexors, which larger lifts train only indirectly through gripping.
  body_regions:
    - forearms
  primary_targets:
    - wrist flexors
  secondary_targets: []
  physique_targets:
    - forearm-flexors
  movement_patterns:
    - wrist flexion
  equipment:
    - barbell
    - dumbbell
    - cable
    - band
  equipment_setups:
    - [barbell]
    - [dumbbell]
    - [cable]
    - [band]
  exercise_type: isolation
  laterality: bilateral
  coverage_categories:
    - isolation
    - low-setup
    - low-fatigue
  resistance_profile: Barbell allows the heaviest fixed-path load; dumbbells let each wrist move independently; a cable keeps tension through the whole range at the cost of a less natural wrist path. A band anchored under the foot is lightest at the bottom and heaviest as the wrist curls up.
  stability_demand: low
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - A direct mechanical-tension stimulus for forearm size is wanted, or wrist strength that doesn't depend on grip endurance running out first.
  less_suitable_when:
    - The wrists are already loaded by heavy pressing and pulling in the same session, adding fatigue without much additional growth stimulus.
  mirror_effect: Tends to show up as fullness on the palm-side of the forearm, most noticeable near the elbow with the palm facing up — this thickens the inner forearm rather than changing its outline from the back of the hand side.
  advantages: []
  limitations:
    - The wrist's small range of motion caps how much mechanical work each rep can do, so this exercise is inherently a slow-growth, high-volume tool rather than a heavy-load one.
    - Elbow-region tendons can take on real strain if load increases faster than the tendons adapt, since the forearm musculature is small relative to the loads gripping and pulling exercises expose it to.
  technique_cues:
    - Sit with your forearms on your thighs or a bench, palms up and wrists just past the edge.
    - Let the bar roll down toward your fingertips, then curl the fingers and wrist up as high as possible.
    - Move only the wrists and fingers; keep the forearms down.
  common_mistakes:
    - "Lifting the forearms off the support: the elbows and shoulders help move the weight."
    - "Raising load faster than the forearm tendons adapt: elbow pain is the usual result."
    - "Short, fast reps that skip the full wrist range: the forearm flexors miss the stretched and fully curled positions, which are most of what the exercise trains."
  programming_notes:
    - "Band version: sit with the forearm on the thigh, palm up, and the band anchored under the foot. Shorten the band to add resistance."
  alternatives: []
  complements:
    - Wrist extension work, which balances the other side of the forearm.
  overlaps_with: []
  evidence_notes: []
  review_status: reviewed
