- id: pallof-press
  name: Pallof Press
  summary: Loads anti-rotation directly, a control-and-durability tool rather than a primary hypertrophy driver.
  why_this_exists: Loads anti-rotation directly, a role that crunches and planks do not cover.
  body_regions:
    - core
  primary_targets:
    - obliques
  secondary_targets:
    - rectus abdominis
    - hip musculature
  physique_targets:
    - obliques
  functional_goals:
    - core-anti-rotation
  movement_patterns:
    - anti-rotation isometric
  equipment:
    - band
    - cable
  equipment_setups:
    - [band]
    - [cable]
  exercise_type: isolation
  laterality: unilateral
  coverage_categories:
    - isolation
    - low-fatigue
    - low-setup
  resistance_profile: Band or cable, isometric hold.
  stability_demand: medium
  skill_demand: low
  setup_time: low
  fatigue_cost: low
  best_used_when:
    - Trunk control and stability that transfers to standing, carrying, and single-side loading are the goal — a control-and-durability role more than a primary hypertrophy driver.
  less_suitable_when:
    - The hips rotate along with the load, which defeats the anti-rotation demand that's the entire point of the movement.
  mirror_effect: A minor, tightening effect on the waist rather than an added-size one — this is control work, and the light loading it uses keeps it unlikely to visibly thicken the obliques the way heavier rotational work can.
  advantages: []
  limitations:
    - The stimulus is inherently light — this is a control-and-durability tool, not a movement that drives meaningful oblique hypertrophy on its own.
    - Band or cable resistance is hard to load heavily in a way that keeps adding real challenge over time, unlike a barbell-based progression.
  technique_cues:
    - Set a cable or band at chest height and stand side-on, feet about shoulder width, far enough away that there's tension at the start.
    - Hold the handle at your sternum with both hands, ribs down and glutes tight.
    - Press the handle straight out from your chest and hold for a few seconds without letting the torso turn toward the anchor.
    - Bring it back to the chest under control, then finish all reps before switching sides.
  common_mistakes:
    - "Letting the torso or hips twist toward the anchor: the anti-rotation demand, the whole point of the exercise, disappears."
    - "Standing so close there's little tension: the press feels easy and does little."
    - "Pressing up or out to the side instead of straight forward from the sternum: shortens the lever, so the trunk has less rotation to resist."
  programming_notes:
    - Progress by standing farther from the anchor or holding each press longer, rather than only adding stack weight.
  alternatives: []
  complements:
    - Trunk flexion and anti-extension work.
