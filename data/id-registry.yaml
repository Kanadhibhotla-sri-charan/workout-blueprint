# Published id registry (Workout Logger release checks, 2026-10-27).
#
# Every id an app may have stored. validate-data.js fails when:
#   - an id listed here no longer exists and has no entry in `aliases`
#     (a rename or removal without an alias), or
#   - an id exists in the data but is not listed here (register new ids
#     when adding them).
# To rename an id: add `old-id: new-id` under aliases, update this list,
# and record the rename in CHANGELOG.md.

