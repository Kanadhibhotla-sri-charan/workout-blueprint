# Programming Profile catalog (Phase 4B §10-11) — a reusable, deterministic
# classification layer between "what exercise is this" and "what
# programming guidance applies to it," built entirely from existing
# exercise metadata (exercise_type, coverage_categories, stability_demand —
# fields every record already has per SCHEMA.md) rather than a hand-written
# prescription per exercise. Phase 4B §9's explicit guardrail: do NOT
# create 123 individual programming records; this file has one entry per
# profile (8 total), not one per exercise.
#
# Supersedes the classification logic that previously lived directly in
# rep-ranges.yaml's `defaults:` list — this file now owns the
# exercise_type/coverage_categories/stability_demand -> profile mapping.
# rep-ranges.yaml's `overrides:` list (exercise-specific escape hatch)
# still applies afterward, unchanged, for the rare case a real exercise-
# specific distinction is worth recording (see rep-ranges.yaml's own
# comment — still empty by design for the Phase 4 v1 slice).
#
# Every profile carries:
#   - a rep-range (same shape rep-ranges.yaml's old defaults used, so
#     resolveRepRange's behavior for existing exercises is unchanged);
#   - a guidance_note: a short, profile-specific piece of programming
#     advice distinct from the generic global principles, so exercises of
#     different profiles visibly differ in more than just numbers (Phase
#     4B §25 Test C — "should not blindly receive identical programming
#     guidance when their exercise characteristics materially differ").
#
# Classification is first-match-wins, in list order, same discipline as
# every other rule-based lookup in this dataset (rep-ranges.yaml,
# aesthetic-outcomes.yaml's target resolution, etc.) — never a blended or
# invented numerical score.

profiles:
  - id: heavy-free-weight-compound
    name: Heavy free-weight compound
    summary: >-
      A free-weight-loaded compound movement without a fixed stabilizing
      path — meaningful load can be managed, but stability and technique
      both matter more than on a fixed-path machine.
    primary_range: [6, 12]
    acceptable_range: [5, 15]
    rep_range_reason: >-
      Heavy compound movements are commonly trained in a moderate rep
      range where meaningful load can still be managed with good
      technique; higher reps remain usable, just less commonly the
      primary focus for this kind of movement.
    guidance_note: >-
      Technical breakdown risk rises as fatigue accumulates on a movement
      like this — prioritize crisp reps with good bar/body path over
      grinding out a final rep with degrading form.

  - id: stable-compound
    name: Stable compound
    summary: >-
      A fixed-path or otherwise more stable compound movement — lower
      stability demand than a free-weight compound, so a somewhat wider
      rep range is commonly well tolerated.
    primary_range: [8, 15]
    acceptable_range: [6, 20]
    rep_range_reason: >-
      Fixed-path or otherwise more stable compound movements commonly
      tolerate a somewhat wider rep range than a heavy free-weight
      compound, since stability demand is lower.
    guidance_note: >-
      The fixed path removes most of the balancing and stabilizing work a
      free-weight version would need, so effort can be focused more
      directly on the working muscle across a wider rep range.

  - id: lengthened-position-isolation
    name: Lengthened-position isolation
    summary: >-
      An isolation movement whose hardest point sits at, or near, the
      stretched end of the range — the position current hypertrophy
      research most consistently associates with a stretch-mediated
      growth benefit.
    primary_range: [8, 15]
    acceptable_range: [6, 20]
    rep_range_reason: >-
      A moderate rep range that still allows real loading of the
      stretched position — very high reps tend to reduce how much load
      can be handled at the hardest, most stretched point, which is the
      point this profile is built around.
    guidance_note: >-
      The stretched position is where this exercise does its most
      distinctive work — resist the urge to shorten the range of motion
      just to move more weight, since that range is the reason to choose
      this exercise over a shorter-range alternative.

  - id: shortened-position-isolation
    name: Shortened-position isolation
    summary: >-
      An isolation movement whose hardest point sits at, or near, the
      shortened/contracted end of the range, rather than the stretch.
    primary_range: [10, 20]
    acceptable_range: [8, 30]
    rep_range_reason: >-
      Isolation movements biased toward the shortened position commonly
      tolerate a wide rep range, similar to isolation work generally,
      since the loading challenge is concentrated away from the
      joint-stress-sensitive stretched end of the range.
    guidance_note: >-
      Peak tension is concentrated at the top/contracted position on this
      movement — a deliberate pause or squeeze there is more relevant
      here than it would be on a lengthened-position exercise.

  - id: constant-tension-isolation
    name: Constant-tension isolation
    summary: >-
      A cable-, band-, or otherwise constant-tension isolation movement
      with low fatigue cost — the working muscle rarely gets a true rest
      within the rep.
    primary_range: [10, 20]
    acceptable_range: [8, 30]
    rep_range_reason: >-
      Isolation movements commonly tolerate a wide rep range without
      losing effectiveness, and constant-tension equipment in particular
      removes the brief unloaded moments a free weight's resistance curve
      can create.
    guidance_note: >-
      Because tension rarely fully releases during the rep, this tends to
      feel harder at a given weight than the number on the stack
      suggests — judge effort by RIR, not by comparing that number to a
      free-weight equivalent.

  - id: elevated-stability-isolation
    name: Elevated-stability isolation
    summary: >-
      An isolation movement with real balance or stabilization demand
      beyond the baseline case — genuine body-positioning or control work
      alongside the target-muscle effort, regardless of the specific
      equipment used.
    primary_range: [8, 15]
    acceptable_range: [6, 20]
    rep_range_reason: >-
      An isolation movement with genuine stabilization demand commonly
      sits closer to a moderate rep range than the widest isolation
      ranges, since body positioning and control both matter to executing
      it well, not just the target-muscle effort.
    guidance_note: >-
      This carries more balance and stabilization demand than a typical
      isolation exercise — form and control matter more here, and
      pushing the load too aggressively tends to break technique down
      before the target muscle is genuinely the limiting factor.

  - id: moderate-hypertrophy-isolation
    name: Moderate hypertrophy isolation
    summary: >-
      A stable, machine- or cable-based isolation movement without a
      distinctive lengthened/shortened-position bias or unusually low
      fatigue cost — the general-purpose isolation case.
    primary_range: [10, 20]
    acceptable_range: [8, 30]
    rep_range_reason: >-
      Isolation movements commonly tolerate a wide rep range without
      losing effectiveness, since they typically carry a lower
      technical-breakdown and joint-loading concern at higher reps than a
      heavy compound movement does.
    guidance_note: >-
      A stable, general-purpose isolation movement — a reasonable default
      choice for adding direct volume to a target without much technique
      risk at higher reps.

  - id: compound-general
    name: General compound
    summary: >-
      A compound movement not otherwise carrying the heavy-compound or
      stable-compound coverage category — most often a unilateral or
      otherwise structurally distinct compound variation.
    primary_range: [6, 15]
    acceptable_range: [5, 20]
    rep_range_reason: >-
      A general compound-movement range, used when a compound exercise
      doesn't carry the heavy-compound or stable-compound coverage
      category specifically.
    guidance_note: >-
      This doesn't fit neatly into the usual heavy- or stable-compound
      pattern — treat the ranges here as a reasonable starting point and
      adjust based on how it actually feels to load and control.

  # --- Athletic training modes (athletic expansion, 2026-10) ---------------
  # Used only by exercise records that carry a `training_mode`. Every
  # pre-existing record has no mode and never matches these. Numbers are
  # practical starting points, not sourced prescriptions; `unit` says what
  # primary_range counts (reps or seconds). RIR and intensity techniques do
  # not apply to these modes; `effort` replaces them.
  - id: power
    training_mode: power
    name: Power / plyometric
    summary: >-
      Explosive jumping, bounding and landing work, trained for speed and
      quality of each rep rather than fatigue.
    unit: reps
    primary_range: [3, 6]
    acceptable_range: [2, 8]
    sets: [3, 5]
    rest_seconds: [90, 180]
    frequency_per_week: [2, 3]
    effort: >-
      Maximal intent on every rep, stopping well before height, speed or
      landing quality drops. Never trained to failure.
    rep_range_reason: >-
      Low reps with full rest keep every rep fast and well landed; fatigue
      makes jumps slower and landings sloppier, which defeats the purpose.
    guidance_note: >-
      Do these early in a session while fresh, and progress by quality and
      height before adding more reps.

  - id: agility
    training_mode: agility
    name: Agility / footwork
    summary: >-
      Short, sharp change-of-direction and footwork bursts, trained for speed
      and control.
    unit: seconds
    primary_range: [5, 15]
    acceptable_range: [5, 20]
    sets: [4, 8]
    rest_seconds: [30, 90]
    frequency_per_week: [2, 3]
    effort: >-
      Fast and sharp but controlled; end the set when foot speed or balance
      starts to drop.
    rep_range_reason: >-
      Short bursts with enough rest keep the footwork quick and precise
      rather than turning it into tired conditioning.
    guidance_note: >-
      Stay low and light on the feet; speed comes after clean, balanced
      movement.

  - id: movement-strength
    training_mode: movement-strength
    name: Movement strength
    summary: >-
      Controlled strength work in athletic positions such as lateral and
      split stances, where position and balance matter as much as load.
    unit: reps
    primary_range: [6, 10]
    acceptable_range: [5, 12]
    sets: [2, 4]
    rest_seconds: [60, 120]
    frequency_per_week: [2, 3]
    effort: >-
      Controlled reps stopping 2 to 3 reps short of failure, keeping the
      knee, hip and trunk in good position throughout.
    rep_range_reason: >-
      A moderate range builds strength in the position without fatigue
      degrading balance and alignment.
    guidance_note: >-
      Own the position first; add load only once every rep looks the same.

  - id: mobility-hold
    training_mode: mobility-hold
    name: Mobility hold
    summary: >-
      Held stretches and positions that build comfortable range of motion.
    unit: seconds
    primary_range: [30, 60]
    acceptable_range: [20, 90]
    sets: [2, 3]
    rest_seconds: [15, 30]
    frequency_per_week: [3, 7]
    effort: >-
      A clear but comfortable stretch, breathing slowly; never push into
      pain.
    rep_range_reason: >-
      Holds of half a minute or more give time to relax into the position.
    guidance_note: >-
      Frequency matters more than intensity; short regular sessions work
      better than occasional hard stretching.
    best_timing: >-
      After training or on rest days, when the body is warm. For lasting
      range, aim for about 5 minutes or more of stretching per area each
      week, spread over most days: a 2018 review of 23 studies found that
      weekly stretching time and frequency mattered more than time per
      session.

  - id: mobility-dynamic
    training_mode: mobility-dynamic
    name: Mobility drill
    summary: >-
      Controlled, moving mobility drills that take a joint through its range
      repeatedly.
    unit: reps
    primary_range: [6, 10]
    acceptable_range: [5, 12]
    sets: [2, 3]
    rest_seconds: [15, 45]
    frequency_per_week: [3, 7]
    effort: >-
      Smooth, controlled reps through the range you own, easing slightly
      deeper over the sets; no bouncing.
    rep_range_reason: >-
      Enough reps to explore the range without turning the drill into a
      strength set.
    guidance_note: >-
      Works well as a warm-up before court sessions or lower-body training.
    best_timing: >-
      Before training or court sessions, as part of the warm-up.

  - id: conditioning
    training_mode: conditioning
    name: Conditioning intervals
    summary: >-
      Repeated work intervals that build the endurance to keep moving hard
      through long rallies and sessions.
    unit: seconds
    primary_range: [20, 60]
    acceptable_range: [15, 120]
    sets: [6, 10]
    rest_seconds: [20, 90]
    frequency_per_week: [1, 3]
    effort: >-
      Hard but repeatable, roughly 7 to 8 out of 10, finishing every round at
      a similar pace.
    rep_range_reason: >-
      Intervals of 20 to 60 seconds with short rests mirror the stop-start
      demand of rallies while staying repeatable.
    guidance_note: >-
      Progress by adding rounds or shortening rest, one change at a time.

  - id: soft-tissue
    training_mode: soft-tissue
    name: Soft-tissue rolling
    summary: >-
      Foam rolling and similar self-massage, used to ease muscle tightness
      around training.
    unit: seconds
    primary_range: [30, 60]
    acceptable_range: [20, 120]
    sets: [1, 2]
    rest_seconds: [0, 15]
    frequency_per_week: [2, 7]
    effort: >-
      Moderate, tolerable pressure while breathing normally; ease off on
      sharp or tingling pain and never roll directly over a joint or bone.
    rep_range_reason: >-
      About half a minute to a minute per area is a common practical
      starting point, not a measured dose.
    guidance_note: >-
      Any effect on range of motion or soreness is thought to be small and
      short-lived, so rolling supports stretching and strength work rather
      than replacing them.
    best_timing: >-
      Briefly as part of a warm-up, or for longer after training and on
      rest days.

classification:
  # Phase 4C §13's canonical rule: exercise_type gates the primary
  # profile family FIRST; coverage_categories only refine within it,
  # never override it. Before Phase 4C, the two compound-profile rules
  # below matched on coverage_categories_any alone with no exercise_type
  # check, so an isolation exercise carrying a heavy-compound/stable-
  # compound coverage tag (a real case: seated-calf-raise and leg-press-
  # calf-raise both carry `stable-compound` despite being isolation
  # movements) would be misclassified into a compound programming
  # profile. Audited against the full 123-exercise database (Phase 4C
  # §14) — these were the only 2 contradictions found.
  defaults:
    # Athletic training modes first; they match only records with that
    # training_mode, and records without one never match them.
    - profile_id: power
      match:
        training_mode: power
    - profile_id: agility
      match:
        training_mode: agility
    - profile_id: movement-strength
      match:
        training_mode: movement-strength
    - profile_id: mobility-hold
      match:
        training_mode: mobility-hold
    - profile_id: mobility-dynamic
      match:
        training_mode: mobility-dynamic
    - profile_id: conditioning
      match:
        training_mode: conditioning
    - profile_id: soft-tissue
      match:
        training_mode: soft-tissue
    - profile_id: heavy-free-weight-compound
      match:
        exercise_type: compound
        coverage_categories_any: [heavy-compound]
    - profile_id: stable-compound
      match:
        exercise_type: compound
        coverage_categories_any: [stable-compound]
    - profile_id: lengthened-position-isolation
      match:
        exercise_type: isolation
        coverage_categories_any: [lengthened-position-emphasis]
    - profile_id: shortened-position-isolation
      match:
        exercise_type: isolation
        coverage_categories_any: [shortened-position-emphasis]
    - profile_id: constant-tension-isolation
      match:
        exercise_type: isolation
        coverage_categories_any: [low-fatigue]
    - profile_id: elevated-stability-isolation
      match:
        exercise_type: isolation
        stability_demand_at_least: medium
    - profile_id: moderate-hypertrophy-isolation
      match:
        exercise_type: isolation
    - profile_id: compound-general
      match:
        exercise_type: compound
