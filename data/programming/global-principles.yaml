# Global hypertrophy-programming principles — apply broadly across targets
# and exercises rather than being repeated per-record (architect Guardrail
# 8: don't duplicate programming knowledge when a shared rule suffices).
#
# Evidence basis: per the architect's approval of the "practical consensus
# ranges, lightly sourced" approach — these reflect broadly-converged,
# widely-taught hypertrophy-coaching consensus, not per-line citations the
# way data/exercises/*.yaml's evidence_notes field works. Every range below
# is a starting point to adjust from, not an exact physiological law —
# see the wording rules at the bottom of this file.

rir:
  full_range: [0, 4]
  typical_working_range: [1, 3]
  explanation: >-
    RIR (Reps In Reserve) is a practical way to gauge effort: finish a
    working set when you feel you could still perform roughly the stated
    number of additional good-quality reps with the same form.
  guidance: >-
    Most working sets in a typical practical range sit around 1-3 RIR.
    Training hard is not the same as training to mandatory momentary
    failure — occasional harder sets closer to failure can have a place,
    but failure is not required for growth, and treating it as mandatory
    tends to add fatigue and injury risk without a clear return.

weekly_volume:
  starting_point_sets: [8, 12]
  practical_range_sets: [10, 20]
  higher_recovery_dependent_sets: [20, 26]
  explanation: >-
    A practical starting range of hard sets per muscle per week, with a
    broader productive range typical beyond that. Higher amounts within
    or beyond this range become increasingly dependent on individual
    recovery, training experience, and how well-managed overall fatigue
    is — more is not automatically better past the point recovery allows
    it to be used well. Adjust based on training experience, recovery,
    current workload, performance, and whether the target is a priority
    or a maintenance area.

frequency:
  typical_starting_range_per_week: [2, 3]
  explanation: >-
    Distinguishes how often a muscle *can* be trained from how it is
    typically useful to distribute its weekly volume. Spreading a given
    weekly volume across more exposures per week is commonly a practical
    way to keep each session's workload manageable, rather than a claim
    that more frequency is inherently superior at equal weekly volume.

progression:
  model: double-progression
  explanation: >-
    A simple, practical progression model. Pick a target rep range (for
    example 8-12). Start with a load that allows completing the low end
    of that range at the target RIR. Over subsequent sessions, add reps
    at the same load until the top of the range is reached at the target
    RIR. Once that happens, increase the load slightly, and the rep count
    typically drops back toward the bottom of the range — then repeat.
  scope_note: >-
    This is the only progression model Phase 4 introduces. Advanced
    periodization and recovery prediction remain out of scope (see the
    Phase 4 architecture spec §29). A simple deload rule was added for the
    Workout Logger in 2026-10 (see `deload` below).

# Load steps per load type (Workout Logger change request 3.1). When the
# top of the rep range is reached, increase the load by about one step;
# compare progress within one exercise variant only. Practical defaults
# from common gym equipment increments, not sourced figures.
load_progression:
  unit: kg
  steps:
    total: 2.5         # barbell / smith / landmine: total load (1.25 kg per side)
    per_hand: 2        # dumbbells / kettlebells: next weight up, per hand
    stack: 1_plate     # machine or cable: next pin on the stack
    band: next_band    # move to the next band tension
    bodyweight: reps_then_2.5   # add reps, then about 2.5 kg of added load
    manual: none       # manual resistance has no load to track

# Session rules (Workout Logger change request 3.2). Practical coaching
# rules the logger's validators and planning prompt should quote.
session_rules:
  exercise_order:
    - big compounds
    - goal muscles
    - isolations
    - core and forearms
  order_note: >-
    Goal muscles may move earlier when they are that session's priority.
  hard_sets_per_session:
    sixty_minutes: [16, 22]
    note: >-
      Total hard sets that typically fit a 60-minute session with rest.
      Sessions should stay under 90 minutes; exercise time costs are in
      each exercise's `time` block.
  overlap_rule: >-
    A target that received a full (1.0 credit) hard set in a compound
    counts as trained that day. Don't add an isolation for it the same day
    unless it is a goal target. Per-target weekly numbers and per-session
    ceilings are in volume-targets.yaml.

# Deload (Workout Logger change request 3.2). Bell et al. 2023 (Delphi
# consensus of strength and physique coaches) define deloading as "a
# period of reduced training stress designed to mitigate physiological and
# psychological fatigue, promote recovery, and enhance preparedness for
# subsequent training". The timing and amounts below are practical
# defaults, not sourced figures.
deload:
  every_weeks: [5, 7]
  also_when: >-
    Performance drops across several sessions despite normal sleep and
    food.
  sets_multiplier: 0.6
  rir_change: 2
  same_exercises: true
  length_days: 7

wording_rules:
  prefer:
    - typical range
    - practical starting range
    - commonly useful range
    - starting point
    - adjust based on performance and recovery
  avoid:
    - optimal
    - required
    - maximum
    - exactly N sets
    - exactly N reps
  note: >-
    The application must never imply a specific number within these
    ranges is a hard threshold (e.g. that 9 sets is inherently
    insufficient, or that 10 sets is a magic minimum). Every numeric
    range here is a practical starting point, not an exact physiological
    law — see Phase 4 architecture spec §26.
