name: CI

# Runs the full quality gate on every pull request and every push to main,
# so a broken change is caught before it reaches main rather than only in
# the deploy workflow afterward. Supersedes validate-data.yml, which only
# ran the data validator, and only when data/scripts paths changed — that
# still holds here (Task L of PHASE-2-SCHEMA-AND-DATA-GOVERNANCE.md: invalid
# canonical data must not silently enter main), now alongside the app's
# tests, lint, and build.
#
# Deliberately network-free: the YouTube video audit runs separately on a
# schedule (video-audit.yml) and can never fail this gate.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Validate canonical data
        run: npm run validate-data
      - name: Run tests
        working-directory: app
        run: npm test
      - name: Lint
        working-directory: app
        run: npm run lint
      - name: Build
        working-directory: app
        run: npm run build

  # Browser smoke test (Phase 7 Stage 4): the built bundle served under the
  # Pages base path, driven through Explore → Detail → Decide → Build →
  # Detail plus Decide URL state. Off-origin requests are blocked inside the
  # test, so it stays network-independent like the rest of this gate.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root dependencies
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Install Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium
      - name: Smoke test
        working-directory: app
        run: npm run test:e2e
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: app/test-results/
          retention-days: 7
