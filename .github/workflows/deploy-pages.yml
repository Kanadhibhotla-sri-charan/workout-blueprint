name: Deploy to GitHub Pages

# Builds the app/ production bundle and publishes it to GitHub Pages,
# per docs/architecture/DEPLOYMENT-AND-PRODUCTION-READINESS.md §13.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            app/package-lock.json
      - name: Install root dependencies
        # scripts/lib/ (used by app's generate-data.mjs) requires js-yaml,
        # declared in the root package.json, not app/package.json.
        run: npm ci
      - name: Install app dependencies
        working-directory: app
        run: npm ci
      - name: Build (also runs data validation and type-checking)
        working-directory: app
        run: npm run build
      - name: SPA fallback for client-side routing
        working-directory: app
        run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
